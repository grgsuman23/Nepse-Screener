# =====================================================================
#  STRATEGIES — create your own by copying a block and editing it.
#
#  type: signal    -> buy when `entry` is true, sell when `exit` is true
#                     (plus optional stops). Good for swing / trend trading.
#  type: rotation  -> every `rebalance` period, hold the `top_n` stocks that
#                     pass `filter`, ranked by `rank_by`. Good for momentum,
#                     value and sector-rotation investing.
#
#  Expressions use indicator names (see README "Field reference") and
#  functions: cross_above(a,b) cross_below(a,b) shift(a,n) highest(a,n)
#  lowest(a,n) sma(a,n) ema(a,n) rising(a,n) falling(a,n) bars_since(cond)
#  abs(a) min(a,b) max(a,b)   with  and / or / not  and  + - * / > < >= <= ==
#
#  params: lists of values to try in the optimizer; reference them as {name}.
# =====================================================================

strategies:

  - id: trend_rider
    name: Trend Rider (EMA trend + ADX + market regime)
    type: signal
    description: >
      Rides established uptrends. Buys a pullback-and-recover through the 20-EMA
      when price is above the 50-EMA, the 50-EMA is above the 200-SMA, trend
      strength (ADX) is meaningful and the overall NEPSE market is not in a bear
      phase. Exits when the trend breaks or the ATR trailing stop is hit.
    entry: >
      liquid == 1 and regime >= 0 and close > ema_50 and ema_50 > sma_200
      and adx_14 > {adx_min} and plus_di > minus_di and cross_above(close, ema_20)
    exit: "close < ema_50 and st_dir < 0"
    stop_atr: "{stop}"
    rank_by: rs_rating
    max_positions: 8
    position_size: equal
    params:
      adx_min: [15, 20, 25]
      stop: [2.5, 3.0, 3.5]
    defaults: {adx_min: 20, stop: 3.0}

  - id: momentum_rotation
    name: Momentum Rotation (3-6 month relative strength)
    type: rotation
    description: >
      NEPSE moves in strong, persistent waves driven by retail flows, so recent
      winners tend to keep winning for a few months. Each month hold the 8
      liquid stocks with the best blended 3- and 6-month return that are above a
      rising 200-day average. Moves fully to cash when the market regime turns bearish.
    rebalance: monthly
    filter: "liquid == 1 and close > sma_200 and sma200_slope > 0"
    rank_by: "{w3} * ret_3m + (1 - {w3}) * ret_6m"
    hold_while: "close > sma_200"
    top_n: "{top}"
    regime_filter: "regime >= 0"
    params:
      w3: [0.3, 0.5, 0.7]
      top: [6, 8, 10]
    defaults: {w3: 0.5, top: 8}

  - id: breakout_volume
    name: Volume Breakout (55-day high + volume surge)
    type: signal
    description: >
      Turtle / Darvas style breakout. Buys when price closes above its 55-day
      high on at least twice the normal volume, a pattern that often marks the
      start of big NEPSE moves. Exits on a close below the 20-day low.
    entry: >
      liquid == 1 and regime >= 0 and close > hh_55 and vol_ratio > {vol}
      and close > sma_200 and chg_pct > 0.02
    exit: "close < ll_20"
    stop_atr: 2.5
    rank_by: vol_ratio
    max_positions: 8
    params:
      vol: [1.5, 2.0, 3.0]
    defaults: {vol: 2.0}

  - id: pullback_uptrend
    name: Pullback in Uptrend (RSI-2 mean reversion)
    type: signal
    description: >
      Buys short, sharp dips (2-day RSI below 10) in stocks that are in a
      long-term uptrend, and sells into the bounce. Short holding periods.
    entry: "liquid == 1 and regime >= 0 and close > sma_200 and ema_50 > sma_200 and rsi_2 < {rsi_in}"
    exit: "rsi_2 > 70"
    stop_loss_pct: 0.08
    max_hold_days: 12
    rank_by: rs_rating
    max_positions: 6
    params:
      rsi_in: [5, 10, 15]
    defaults: {rsi_in: 10}

  - id: supertrend_macd
    name: Supertrend + MACD Confirmation
    type: signal
    description: >
      Buys when MACD crosses above its signal line while the Supertrend is
      bullish and price is above the 200-day average; exits when Supertrend flips.
    entry: "liquid == 1 and st_dir > 0 and cross_above(macd, macd_signal) and close > sma_200"
    exit: "st_dir < 0"
    rank_by: rs_rating
    max_positions: 8

  - id: quality_value
    name: Quality at a Reasonable Price (fundamental)
    type: rotation
    description: >
      Each quarter hold the 10 liquid, profitable stocks with the best combined
      value (low P/E and P/B versus sector peers, dividend yield) and quality
      (ROE) scores - but only while they are above their 200-day average, which
      avoids value traps in falling stocks.
    rebalance: quarterly
    filter: "liquid == 1 and eps > 0 and roe > 0.08 and pe > 0 and close > sma_200"
    rank_by: "score_value + score_quality"
    hold_while: "eps > 0 and close > sma_200 * 0.95"
    top_n: 10
    regime_filter: null

  - id: sector_rotation
    name: Sector Rotation (leaders in leading sectors)
    type: rotation
    description: >
      Money rotates between NEPSE sectors (banks, hydro, microfinance,
      insurance...). Each month buy the strongest stocks inside the
      top-ranked sectors by relative strength.
    rebalance: monthly
    filter: "liquid == 1 and sector_rs_rank >= {sec_min} and close > ema_50"
    rank_by: rs_rating
    top_n: 8
    regime_filter: "regime >= 0"
    params:
      sec_min: [60, 70, 80]
    defaults: {sec_min: 70}

  - id: model_score
    name: Composite Model (the screener's own BUY calls)
    type: rotation
    description: >
      Follows the screener's composite score: each week hold the 10
      highest-scoring stocks rated BUY or STRONG BUY, keep them while they stay
      rated HOLD or better, and step aside in a bear market. This is how the
      screener's own recommendations would have performed.
    rebalance: weekly
    filter: "liquid == 1 and stance_code >= 1"
    rank_by: score
    hold_while: "stance_code >= 0"
    top_n: 10
    regime_filter: "regime >= 0"
