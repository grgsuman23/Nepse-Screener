<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEPSE Screener</title>
<style>
:root{
  --blue:#0C4DA1; --blue-d:#083672; --blue-l:#E8F0FB; --red:#ED1B24; --red-l:#FDECEC;
  --green:#1E8E3E; --green-l:#E6F4EA; --amber:#E37400; --amber-l:#FEF3E2;
  --ink:#1F2933; --mut:#5F6B7A; --line:#E3E8EF; --bg:#F5F7FA; --card:#FFFFFF;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
header{background:var(--blue);color:#fff;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:20;box-shadow:0 2px 6px rgba(0,0,0,.15)}
header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.2px}
header h1 span{color:#fff;background:var(--red);border-radius:4px;padding:1px 6px;margin-left:6px;font-size:11px;vertical-align:middle}
header .meta{font-size:12px;opacity:.9}
nav{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
nav button{background:transparent;color:#DCE6F5;border:0;padding:8px 12px;border-radius:6px;font:600 13px system-ui;cursor:pointer}
nav button:hover{background:rgba(255,255,255,.12);color:#fff}
nav button.on{background:#fff;color:var(--blue)}
main{padding:18px 20px;max-width:1500px;margin:0 auto}
.banner{background:var(--amber-l);border:1px solid #F6D3A1;color:#7A4300;padding:8px 12px;border-radius:8px;margin-bottom:12px;font-size:13px}
.banner.red{background:var(--red-l);border-color:#F5B5B7;color:#8A1016}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);font-weight:600}
.kpi .v{font-size:22px;font-weight:700;margin-top:2px}
.kpi .s{font-size:12px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.card h3{margin:0 0 10px;font-size:14px;color:var(--blue);display:flex;align-items:center;gap:8px}
.card h3 small{color:var(--mut);font-weight:400}
.pos{color:var(--green)} .neg{color:var(--red)} .mut{color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{position:sticky;top:0;background:#F0F4FA;color:#334;text-align:left;font-weight:600;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
th.num,td.num{text-align:right}
td{padding:6px 8px;border-bottom:1px solid #EEF1F5;white-space:nowrap}
tr.click:hover td{background:var(--blue-l);cursor:pointer}
.tablewrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:8px}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.3px;white-space:nowrap}
.b-sb{background:var(--green);color:#fff}.b-b{background:var(--green-l);color:var(--green)}
.b-h{background:#EEF1F5;color:#4A5563}.b-r{background:var(--amber-l);color:var(--amber)}.b-e{background:var(--red);color:#fff}
.b-add{background:var(--green-l);color:var(--green)}
.b-bull{background:var(--green);color:#fff}.b-bear{background:var(--red);color:#fff}.b-neu{background:var(--amber);color:#fff}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
select,input,button.btn{font:13px system-ui;padding:6px 9px;border:1px solid #CBD3DD;border-radius:6px;background:#fff;color:var(--ink)}
button.btn{cursor:pointer;font-weight:600}
button.btn.pri{background:var(--blue);color:#fff;border-color:var(--blue)}
button.btn.red{background:var(--red);color:#fff;border-color:var(--red)}
button.btn:hover{filter:brightness(.95)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--blue-l);color:var(--blue);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.chip b{cursor:pointer}
.chart{position:relative;width:100%}
.chart canvas{display:block;width:100%}
.tip{position:absolute;pointer-events:none;background:rgba(20,30,45,.92);color:#fff;font-size:11.5px;padding:6px 8px;border-radius:6px;white-space:nowrap;display:none;z-index:5;line-height:1.5}
.bar{height:8px;background:#EEF1F5;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue)}
.factor{display:grid;grid-template-columns:110px 1fr 38px;gap:8px;align-items:center;font-size:12.5px;margin:5px 0}
.modal{position:fixed;inset:0;background:rgba(10,20,40,.45);display:none;z-index:50;overflow:auto;padding:30px 12px}
.modal .box{background:#fff;max-width:1150px;margin:0 auto;border-radius:12px;padding:18px 20px;position:relative}
.modal .x{position:absolute;right:14px;top:10px;font-size:22px;border:0;background:none;cursor:pointer;color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 14px;font-size:12.5px}
.stats div{display:flex;justify-content:space-between;border-bottom:1px dashed #E6EAF0;padding:3px 0}
.stats span{color:var(--mut)}
ul.reasons{margin:6px 0 0;padding-left:18px}
ul.reasons li{margin:2px 0}
code,pre{font-family:var(--mono);font-size:12px}
pre{background:#F4F6FA;border:1px solid var(--line);border-radius:8px;padding:10px;white-space:pre-wrap}
.seg{display:inline-flex;border:1px solid #CBD3DD;border-radius:6px;overflow:hidden}
.seg button{border:0;background:#fff;padding:5px 10px;font:600 12px system-ui;cursor:pointer;color:var(--mut)}
.seg button.on{background:var(--blue);color:#fff}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:4px 0 6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.empty{padding:26px;text-align:center;color:var(--mut)}
.small{font-size:12px}
.right{margin-left:auto}
.hide{display:none!important}
footer{padding:16px 20px 30px;color:var(--mut);font-size:12px;text-align:center}
@media(max-width:700px){main{padding:12px}.g2{grid-template-columns:1fr}nav{margin-left:0}}
</style>
</head>
<body>
<header>
  <h1>NEPSE Screener<span id="demoTag" class="hide">DEMO DATA</span></h1>
  <div class="meta" id="hdrMeta">Loading…</div>
  <nav id="nav">
    <button data-tab="market" class="on">Market</button>
    <button data-tab="screener">Screener</button>
    <button data-tab="sectors">Sectors</button>
    <button data-tab="strategies">Strategies &amp; Backtests</button>
    <button data-tab="portfolio">My Portfolio</button>
    <button data-tab="track">Track Record</button>
    <button data-tab="help">Help</button>
  </nav>
</header>
<main>
  <div id="banners"></div>
  <section id="tab-market"></section>
  <section id="tab-screener" class="hide"></section>
  <section id="tab-sectors" class="hide"></section>
  <section id="tab-strategies" class="hide"></section>
  <section id="tab-portfolio" class="hide"></section>
  <section id="tab-track" class="hide"></section>
  <section id="tab-help" class="hide"></section>
</main>
<div class="modal" id="modal"><div class="box"><button class="x" onclick="closeModal()">×</button><div id="modalBody"></div></div></div>
<footer>For personal research only — not investment advice. Prices adjusted for bonus/right shares. Data: NEPSE, Merolagani, ShareSansar.</footer>

<script>
/* ======================================================================
   Data loading (works from GitHub Pages, or embedded for offline preview)
   ====================================================================== */
const D = {};
const HIST = {};
async function getJSON(name){
  if (window.EMBED && window.EMBED[name] !== undefined) return window.EMBED[name];
  const r = await fetch('data/' + name + '.json?v=' + Date.now().toString().slice(0,-5));
  if (!r.ok) throw new Error(name + ': HTTP ' + r.status);
  return r.json();
}
async function getHistory(sym){
  if (HIST[sym]) return HIST[sym];
  try { HIST[sym] = await getJSON('history/' + sym); } catch(e){ HIST[sym] = null; }
  return HIST[sym];
}
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isNum = v => typeof v === 'number' && isFinite(v);
const fmt = {
  n: (v, d=2) => isNum(v) ? v.toLocaleString('en-IN', {minimumFractionDigits:d, maximumFractionDigits:d}) : '–',
  i: v => isNum(v) ? Math.round(v).toLocaleString('en-IN') : '–',
  p: (v, d=1) => isNum(v) ? (v*100).toFixed(d) + '%' : '–',
  sp: (v, d=1) => isNum(v) ? (v>0?'+':'') + (v*100).toFixed(d) + '%' : '–',
  npr: v => { if(!isNum(v)) return '–'; const a=Math.abs(v);
    if (a>=1e9) return (v/1e9).toFixed(2)+' Arab'; if (a>=1e7) return (v/1e7).toFixed(2)+' Cr'; if (a>=1e5) return (v/1e5).toFixed(2)+' L';
    return Math.round(v).toLocaleString('en-IN'); },
};
const cls = v => isNum(v) ? (v > 0 ? 'pos' : v < 0 ? 'neg' : '') : '';
const STANCE = {2:'STRONG BUY',1:'BUY',0:'HOLD','-1':'REDUCE','-2':'EXIT'};
function stanceBadge(code){
  if(!isNum(code)) return '<span class="badge b-h">N/A</span>';
  const c = {2:'b-sb',1:'b-b',0:'b-h','-1':'b-r','-2':'b-e'}[code];
  return `<span class="badge ${c}">${STANCE[code]}</span>`;
}
function actionBadge(a){ const c={EXIT:'b-e',REDUCE:'b-r',HOLD:'b-h',ADD:'b-add'}[a]||'b-h'; return `<span class="badge ${c}">${a==='ADD'?'BUY MORE':a}</span>`; }
function regimeBadge(r){ return r>0?'<span class="badge b-bull">BULL</span>':r<0?'<span class="badge b-bear">BEAR</span>':'<span class="badge b-neu">NEUTRAL</span>'; }

/* ======================================================================
   Minimal canvas chart library (lines, areas, bars, candles, scatter)
   ====================================================================== */
const C = {blue:'#0C4DA1', red:'#ED1B24', green:'#1E8E3E', amber:'#E37400', grey:'#9AA5B1', lblue:'#7FA6DA', purple:'#7B4FB8', teal:'#00897B'};
function makeChart(host, opt){
  host.innerHTML = ''; host.classList.add('chart');
  const cv = document.createElement('canvas'); const tip = document.createElement('div'); tip.className='tip';
  host.appendChild(cv); host.appendChild(tip);
  const H = opt.height || 300;
  function draw(hover){
    const W = host.clientWidth || 600, dpr = window.devicePixelRatio || 1;
    cv.width = W*dpr; cv.height = H*dpr; cv.style.height = H+'px';
    const g = cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,H);
    g.font = '11px system-ui'; g.textBaseline = 'middle';
    const n = opt.x.length; const L = opt.left ?? 56, R = opt.right ?? 12; const plotW = W-L-R;
    const xpos = i => L + (n<=1 ? plotW/2 : i*(plotW)/(n-1));
    let top = 8; const totalF = opt.panels.reduce((a,p)=>a+(p.h||1),0); const gap = 18; const usable = H - 22 - gap*(opt.panels.length-1) - 8;
    const layout = [];
    opt.panels.forEach((p, pi) => {
      const ph = usable*(p.h||1)/totalF; const y0 = top, y1 = top+ph; top = y1 + gap;
      let lo = Infinity, hi = -Infinity;
      p.series.forEach(s => {
        if (s.type==='candle'){ for(let i=0;i<n;i++){ if(isNum(s.l[i])) lo=Math.min(lo,s.l[i]); if(isNum(s.h[i])) hi=Math.max(hi,s.h[i]); } }
        else (s.y||[]).forEach(v => { if(isNum(v)){ lo=Math.min(lo,v); hi=Math.max(hi,v);} });
      });
      if (p.min!==undefined) lo = Math.min(lo, p.min); if (p.max!==undefined) hi = Math.max(hi, p.max);
      if (p.fixed) { lo = p.fixed[0]; hi = p.fixed[1]; }
      if (!isFinite(lo)) { lo=0; hi=1; } if (hi===lo){ hi+=1; lo-=1; }
      const lo0 = lo; const pad = (hi-lo)*0.06; if(!p.fixed){ lo-=pad; hi+=pad; }
      if (p.bars0) lo = lo0 >= 0 ? 0 : Math.min(lo, 0);
      const ypos = v => y1 - (v-lo)/(hi-lo)*(y1-y0);
      layout.push({p, y0, y1, ypos, lo, hi});
      // grid & y labels
      g.strokeStyle = '#EDF0F4'; g.fillStyle = '#7A8594'; g.lineWidth = 1;
      const ticks = Math.max(2, Math.round((y1-y0)/45));
      for (let t=0;t<=ticks;t++){ const v = lo + (hi-lo)*t/ticks, y = ypos(v);
        g.beginPath(); g.moveTo(L,y); g.lineTo(W-R,y); g.stroke(); g.textAlign='right';
        g.fillText((p.yfmt||(x=>Math.abs(x)>=1000?Math.round(x).toLocaleString('en-IN'):x.toFixed(Math.abs(x)<10?2:1)))(v), L-6, y); }
      (p.hlines||[]).forEach(h => { const y=ypos(h.v); g.strokeStyle=h.color||'#C5CCD6'; g.setLineDash([4,4]); g.beginPath(); g.moveTo(L,y); g.lineTo(W-R,y); g.stroke(); g.setLineDash([]); });
      // background bands (e.g. regime)
      if (p.bands){ const bw = plotW/Math.max(1,n-1); for(let i=0;i<n;i++){ const c=p.bands[i]; if(!c) continue; g.fillStyle=c; g.fillRect(xpos(i)-bw/2, y0, bw+0.5, y1-y0);} }
      p.series.forEach(s => {
        if (s.type==='candle'){
          const bw = Math.max(1, Math.min(9, plotW/n*0.7));
          for (let i=0;i<n;i++){ if(!isNum(s.c[i])) continue; const up = s.c[i] >= s.o[i]; g.strokeStyle = g.fillStyle = up ? C.green : C.red;
            const x = xpos(i); g.beginPath(); g.moveTo(x, ypos(s.h[i])); g.lineTo(x, ypos(s.l[i])); g.stroke();
            const yo = ypos(s.o[i]), yc = ypos(s.c[i]); g.fillRect(x-bw/2, Math.min(yo,yc), bw, Math.max(1, Math.abs(yc-yo))); }
        } else if (s.type==='bar'){
          const bw = Math.max(1, plotW/n*0.75); const zero = ypos(Math.max(lo,0));
          for (let i=0;i<n;i++){ const v=s.y[i]; if(!isNum(v)) continue; g.fillStyle = s.colors ? s.colors[i] : (s.color || (v>=0?C.green:C.red)); const y=ypos(v); g.fillRect(xpos(i)-bw/2, Math.min(y,zero), bw, Math.max(1,Math.abs(zero-y))); }
        } else if (s.type==='dots'){
          for (let i=0;i<n;i++){ const v=s.y[i]; if(!isNum(v)) continue; g.fillStyle = s.colors ? s.colors[i] : s.color; g.beginPath(); g.arc(xpos(i), ypos(v), s.r||1.6, 0, 7); g.fill(); }
        } else {
          g.strokeStyle = s.color || C.blue; g.lineWidth = s.w || 1.6; g.setLineDash(s.dash||[]);
          g.beginPath(); let started=false;
          for (let i=0;i<n;i++){ const v=s.y[i]; if(!isNum(v)){ started=false; continue; } const x=xpos(i), y=ypos(v); if(!started){ g.moveTo(x,y); started=true;} else g.lineTo(x,y); }
          g.stroke(); g.setLineDash([]);
          if (s.fill){ g.lineTo(xpos(n-1), ypos(Math.max(lo, s.fillBase ?? lo))); g.lineTo(xpos(0), ypos(Math.max(lo, s.fillBase ?? lo))); g.closePath(); g.fillStyle = s.fill; g.fill(); }
        }
      });
      if (p.title){ g.fillStyle='#4A5563'; g.textAlign='left'; g.font='600 11px system-ui'; g.fillText(p.title, L+4, y0+8); g.font='11px system-ui'; }
    });
    // x labels
    g.fillStyle = '#7A8594'; g.textAlign = 'center';
    const step = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(plotW/90))));
    for (let i=0;i<n;i+=step) g.fillText(String(opt.x[i]).slice(0, opt.xlen||10), xpos(i), H-10);
    if (hover !== undefined && hover >= 0 && hover < n){
      const x = xpos(hover); g.strokeStyle = 'rgba(12,77,161,.45)'; g.beginPath(); g.moveTo(x, 6); g.lineTo(x, H-20); g.stroke();
      let html = `<b>${esc(opt.x[hover])}</b>`;
      layout.forEach(({p}) => p.series.forEach(s => {
        if (s.noTip) return;
        if (s.type==='candle') html += `<br>O ${fmt.n(s.o[hover])} H ${fmt.n(s.h[hover])} L ${fmt.n(s.l[hover])} C <b>${fmt.n(s.c[hover])}</b>`;
        else if (s.name && s.y) html += `<br><span style="color:${s.tipColor||s.color||'#fff'}">■</span> ${esc(s.name)}: ${(s.fmt||p.tipfmt||(v=>fmt.n(v)))(s.y[hover])}`;
      }));
      tip.innerHTML = html; tip.style.display='block';
      const tw = tip.offsetWidth; tip.style.left = Math.min(W - tw - 4, Math.max(4, x + 12)) + 'px'; tip.style.top = '10px';
    } else tip.style.display = 'none';
  }
  draw();
  cv.addEventListener('mousemove', e => { const r = cv.getBoundingClientRect(); const L=opt.left??56, R=opt.right??12; const n=opt.x.length;
    const i = Math.round((e.clientX - r.left - L) / ((r.width - L - R)/Math.max(1,n-1))); draw(Math.max(0, Math.min(n-1, i))); });
  cv.addEventListener('mouseleave', () => draw());
  new ResizeObserver(() => draw()).observe(host);
}
function scatterChart(host, pts, opt={}){
  host.innerHTML=''; host.classList.add('chart'); const cv=document.createElement('canvas'); host.appendChild(cv);
  const H = opt.height || 360;
  function draw(){
    const W=host.clientWidth||500, dpr=window.devicePixelRatio||1; cv.width=W*dpr; cv.height=H*dpr; cv.style.height=H+'px';
    const g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.font='11px system-ui';
    const all = pts.flatMap(p => [p, ...(p.tail||[])]).filter(p=>isNum(p.x)&&isNum(p.y));
    let x0=Math.min(97,...all.map(p=>p.x)), x1=Math.max(103,...all.map(p=>p.x)), y0=Math.min(97,...all.map(p=>p.y)), y1=Math.max(103,...all.map(p=>p.y));
    const px=(x1-x0)*.08, py=(y1-y0)*.08; x0-=px;x1+=px;y0-=py;y1+=py;
    const L=40,R=10,T=10,B=26; const X=v=>L+(v-x0)/(x1-x0)*(W-L-R), Y=v=>H-B-(v-y0)/(y1-y0)*(H-T-B);
    const q=[[100,x1,100,y1,'#E6F4EA','Leading'],[100,x1,y0,100,'#FEF3E2','Weakening'],[x0,100,y0,100,'#FDECEC','Lagging'],[x0,100,100,y1,'#E8F0FB','Improving']];
    q.forEach(([a,b,c,d,col,lab])=>{ g.fillStyle=col; g.fillRect(X(a),Y(d),X(b)-X(a),Y(c)-Y(d)); g.fillStyle='#8893A0'; g.textAlign='left'; g.fillText(lab, X(a)+6, Y(d)+12); });
    g.strokeStyle='#B8C2CE'; g.beginPath(); g.moveTo(X(100),T); g.lineTo(X(100),H-B); g.moveTo(L,Y(100)); g.lineTo(W-R,Y(100)); g.stroke();
    g.fillStyle='#7A8594'; g.textAlign='center'; g.fillText('RS-Ratio (relative strength vs market) →', (L+W-R)/2, H-8);
    g.save(); g.translate(12,(T+H-B)/2); g.rotate(-Math.PI/2); g.fillText('RS-Momentum →',0,0); g.restore();
    const pal=[C.blue,C.red,C.green,C.amber,C.purple,C.teal,'#C2185B','#5D4037','#455A64','#827717','#0097A7','#6D4C41','#283593'];
    pts.forEach((p,i)=>{ const col=pal[i%pal.length]; const t=(p.tail||[]).filter(q=>isNum(q.x)&&isNum(q.y));
      if(t.length>1){ g.strokeStyle=col; g.globalAlpha=.5; g.lineWidth=1.4; g.beginPath(); t.forEach((q,k)=>k?g.lineTo(X(q.x),Y(q.y)):g.moveTo(X(q.x),Y(q.y))); g.stroke(); g.globalAlpha=1; }
      if(!isNum(p.x)||!isNum(p.y)) return; g.fillStyle=col; g.beginPath(); g.arc(X(p.x),Y(p.y),5,0,7); g.fill();
      g.fillStyle='#1F2933'; g.textAlign='left'; g.fillText(p.label, X(p.x)+7, Y(p.y)-6); });
  }
  draw(); new ResizeObserver(draw).observe(host);
}

/* ======================================================================
   App state & navigation
   ====================================================================== */
const state = { tab:'market', screen:'', sector:'', stance:'', liquid:true, q:'', filters:[], cols:'overview', sort:{k:'score',d:-1},
                strat:null, trackSrc:'simulated', trackH:20 };
document.querySelectorAll('#nav button').forEach(b => b.onclick = () => show(b.dataset.tab));
function show(tab){
  state.tab = tab; document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.tab===tab));
  document.querySelectorAll('main > section').forEach(s => s.classList.toggle('hide', s.id !== 'tab-'+tab));
  location.hash = tab; render[tab] && render[tab]();
}
const render = {};

async function boot(){
  try {
    const names = ['meta','market','screener','sectors','presets','strategies','tracking','fields'];
    const vals = await Promise.all(names.map(n => getJSON(n).catch(e => { console.warn(e); return null; })));

  D.rows = D.screener.rows; D.bySym = Object.fromEntries(D.rows.map(r => [r.symbol, r]));

  const h = location.hash.replace('#','');
  show(['market','screener','sectors','strategies','portfolio','track','help'].includes(h) ? h : 'market');
}

}
render.screener = function(){

};
function addFilter(){ const f=$('#fField').value, op=$('#fOp').value, v=parseFloat($('#fVal').value); if(!isFinite(v)) return; state.filters.push({f,op,v}); drawScreener(); }
function delFilter(i){ state.filters.splice(i,1); drawScreener(); }
function filteredRows(){
  let rows = D.rows;
  if (state.screen){ const hits = new Set(D.presetById[state.screen].hits); rows = rows.filter(r => hits.has(r.symbol)); }
  if (state.sector) rows = rows.filter(r => r.sector === state.sector);
  if (state.stance !== ''){ const s=+state.stance; rows = rows.filter(r => s===1 ? r.stance_code>=1 : s===-1 ? r.stance_code<=-1 : r.stance_code===s); }
  if (state.liquid && !state.screen) rows = rows.filter(r => r.liquid);
  if (state.q) rows = rows.filter(r => r.symbol.includes(state.q) || (r.name||'').toUpperCase().includes(state.q));
  state.filters.forEach(({f,op,v}) => rows = rows.filter(r => { const x=r[f]; if(!isNum(x)) return false; return op==='>'?x>v:op==='<'?x<v:op==='>='?x>=v:op==='<='?x<=v:Math.abs(x-v)<1e-9; }));
  const {k,d} = state.sort;
  return [...rows].sort((a,b) => { const x=a[k], y=b[k]; if(typeof x==='string'||typeof y==='string') return d*String(x||'').localeCompare(String(y||'')); return d*((isNum(x)?x:-1e18)-(isNum(y)?y:-1e18)); });
}
function drawScreener(){
  const rows = filteredRows(); const cols = COLSETS[state.cols];
  $('#sFilters').innerHTML = state.filters.map((f,i)=>`<span class="chip">${f.f} ${esc(f.op)} ${f.v} <b onclick="delFilter(${i})">×</b></span>`).join('');
  $('#sPresetExpr').innerHTML = state.screen ? `Rule: <code>${esc(D.presetById[state.screen].expr)}</code>` : '';
  const head = [['symbol','Stock'],['sector','Sector'],...cols.map(c=>[c[0],c[1]])];
  const arrow = k => state.sort.k===k ? (state.sort.d>0?' ▲':' ▼') : '';
  $('#sTable').innerHTML = rows.length ? `<table><thead><tr>${head.map(([k,l],i)=>`<th class="${i>1&&cols[i-2][2]!=='stance'?'num':''}" onclick="sortBy('${k}')">${l}${arrow(k)}</th>`).join('')}</tr></thead><tbody>
    ${rows.map(r=>`<tr class="click" onclick="openStock('${r.symbol}')"><td><b>${r.symbol}</b>${r.stale?' <span class="badge b-h" title="no trade in 7+ days">stale</span>':''}</td><td class="small mut">${esc(r.sector)}</td>${cols.map(c=>`<td class="${c[2]!=='stance'?'num':''}">${cell(r[c[0]], c[2])}</td>`).join('')}</tr>`).join('')}</tbody></table>`
    : '<div class="empty">No stocks match these conditions.</div>';
  $('#sCount').textContent = `${rows.length} stocks · click a row for the chart and full analysis · percentages are entered as decimals in custom rules (5% = 0.05)`;
}
function sortBy(k){ state.sort = {k, d: state.sort.k===k ? -state.sort.d : (k==='symbol'||k==='sector'?1:-1)}; drawScreener(); }
function exportCSV(){
  const rows = filteredRows(); const keys = ['symbol','name','sector',...new Set(Object.values(COLSETS).flat().map(c=>c[0])),'stance'];
  const csv = [keys.join(','), ...rows.map(r => keys.map(k => { const v=r[k]; return typeof v==='string' ? '"'+v.replace(/"/g,'""')+'"' : (v??''); }).join(','))].join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download = 'nepse_screener_'+D.meta.last_trade_date+'.csv'; a.click();
}

function parseCSV(text){
  const lines = text.trim().split(/\r?\n/).filter(Boolean); if (!lines.length) return [];
  const split = l => l.match(/("([^"]|"")*"|[^,]*)(,|$)/g).slice(0,-1).map(x=>x.replace(/,$/,'').replace(/^"|"$/g,'').replace(/""/g,'"').trim());
  const head = split(lines[0]).map(h=>h.toLowerCase().replace(/[^a-z_ ]/g,'').trim().replace(/ +/g,'_'));
  const find = (...ns) => head.findIndex(h => ns.some(n => h===n || h.includes(n)));
  const iS=find('symbol','scrip','script'), iQ=find('quantity','qty','current_balance','balance'), iW=find('wacc','rate','avg','cost'), iD=find('buy_date','purchase','date');
  if (iS<0||iQ<0) throw new Error('CSV needs at least “symbol” and “quantity” columns');
  const num = x => parseFloat(String(x||'').replace(/,/g,''));
  return lines.slice(1).map(l => { const c=split(l); return {symbol:(c[iS]||'').toUpperCase(), quantity:num(c[iQ]), wacc:iW>=0?num(c[iW]):NaN, buy_date:iD>=0?(c[iD]||'').slice(0,10):''}; }).filter(h => h.symbol && h.quantity>0);
}
const COST = () => (D.meta.settings||{}).costs || {};
const PFC = () => (D.meta.settings||{}).portfolio || {};
function commission(v){ const c=COST(); for (const [lim,rate] of (c.broker_commission_tiers||[[null,.004]])) if (lim===null || v<=lim) return Math.max(c.min_commission||10, v*rate); return v*.0024; }
function sellBreakdown(qty, px, basis, days){ const c=COST(); const v=qty*px; const fees=commission(v)+v*(c.sebon_fee||.00015)+(c.dp_charge||25); const gain=v-fees-basis;
  const rate = days > (c.long_term_days||365) ? (c.cgt_long_term??.0375) : (c.cgt_short_term??.05); const tax=Math.max(0,gain)*rate; return {net:v-fees-tax, profit:gain-tax, gain, rate, tax}; }

async function analyzePortfolio(holdings){
  const P = PFC(), k = P.atr_stop_multiple??3, hard=P.hard_stop_pct??.15, maxW=P.max_position_weight??.2, maxSW=P.max_sector_weight??.4, redF=P.reduce_fraction??.5, taxWin=P.tax_wait_window_days??30;
  const c = COST(), lt = c.long_term_days||365, regime = D.market.regime, today = new Date(D.meta.last_trade_date);
  const pos = []; let total = 0; const unknown = [];
  for (const h of holdings){ const r = D.bySym[h.symbol]; if(!r){ unknown.push(h.symbol); continue; } const value=h.quantity*r.close; total+=value; pos.push({h,r,value}); }
  const secVal = {}; pos.forEach(p => secVal[p.r.sector]=(secVal[p.r.sector]||0)+p.value);
  const out = [];
  for (const {h,r,value} of pos){
    const wacc = isNum(h.wacc)&&h.wacc>0 ? h.wacc : r.close, cost = h.quantity*wacc, weight = total?value/total:0, sw = total?secVal[r.sector]/total:0;
    const hist = await getHistory(h.symbol); let peak = r.close;
    const code = isNum(r.stance_code) ? r.stance_code : 0;
    let recentPeak = r.close;
    if (hist){ const bd = h.buy_date ? new Date(h.buy_date) : null; const n = hist.d.length;
      let start = bd ? hist.d.findIndex(d => new Date(d) >= bd) : n-60; if (start<0) start = n-1; start = Math.max(start, n-120, 0);
      peak = Math.max(...hist.c.slice(start).filter(isNum), r.close); recentPeak = Math.max(...hist.c.slice(Math.max(0,n-20)).filter(isNum), r.close); }
    let stop = isNum(r.atr_14) ? peak - k*r.atr_14 : null, basis = `${k}× ATR below highest close ${fmt.n(peak,1)}`, reset = false;
    if (stop!==null && r.close < stop && code >= 1){ stop = recentPeak - k*r.atr_14; basis = `${k}× ATR below 20-day high ${fmt.n(recentPeak,1)}`; reset = true; }
    if (r.st_dir>0 && isNum(r.st_line) && (stop===null || r.st_line>stop)){ stop=r.st_line; basis='Supertrend support'; }
    const days = h.buy_date ? Math.round((today - new Date(h.buy_date))/864e5) : null;
    const br = sellBreakdown(h.quantity, r.close, cost, days??0); // MeroShare WACC already includes buy costs
    const toLT = days!==null && days<=lt ? lt+1-days : 0;
    let action='HOLD', detail='Trend and score do not justify changing the position.', sellQty=0;
    if (stop!==null && r.close < stop){ action='EXIT'; detail=`Closed below trailing stop ${fmt.n(stop,1)} (${basis}).`; sellQty=h.quantity; }
    else if (code===-2){ action='EXIT'; detail='Model rates the stock EXIT: broken trend and weak score.'; sellQty=h.quantity; }
    else if (r.close < wacc*(1-hard) && code<=0){ action='EXIT'; detail=`Loss beyond ${fmt.p(hard,0)} of your cost with no supportive trend — cut the loss.`; sellQty=h.quantity; }
    else if (code===-1){ action='REDUCE'; sellQty=Math.floor(h.quantity*redF); detail = (r.rsi_14>((D.meta.settings.scoring||{}).overbought_rsi||80) && r.close>wacc) ? 'Overextended rally — book partial profit.' : 'Trend weakening — reduce exposure, keep the rest with the stop.'; }
    else if (weight>maxW){ action='REDUCE'; sellQty=Math.floor(h.quantity*(1-maxW/weight)); detail=`Position is ${fmt.p(weight,0)} of the portfolio (limit ${fmt.p(maxW,0)}) — trim to control risk.`; }
    else if (code>=1 && regime>=0 && weight<maxW*.8 && sw<maxSW){ action='ADD'; detail='Model rates BUY'+(code===2?' (STRONG)':'')+' and the trend is up — adding on dips is reasonable.'; }
    const notes=[];
    if (action!=='EXIT' && br.gain>0 && toLT>0 && toLT<=taxWin){ notes.push(`Hold ${toLT} more days for long-term CGT (${fmt.p(c.cgt_long_term,2)} vs ${fmt.p(c.cgt_short_term,0)}) — saves ≈ Rs ${fmt.i(br.gain*((c.cgt_short_term||.05)-(c.cgt_long_term||.0375)))}.`); }
    if (sw>maxSW) notes.push(`${r.sector} is ${fmt.p(sw,0)} of the portfolio (limit ${fmt.p(maxSW,0)}).`);
    if (!r.liquid) notes.push('Low liquidity — exits may take several sessions.');
    if (regime<0 && action==='HOLD') notes.push('Bear market regime — tighten stops, avoid averaging down.');
    if (reset) notes.push('The older trailing stop was breached earlier, but the trend has recovered — stop reset to the recent swing.');
    if (!h.buy_date) notes.push('Add a buy date for the exact CGT rate and trailing stop.');
    out.push({...h, r, wacc, cost, value, pnl:value-cost, pnlPct:cost?value/cost-1:null, weight, action, detail, sellQty, stop, basis, days, toLT, br, notes});
  }
  const ord={EXIT:0,REDUCE:1,ADD:2,HOLD:3}; out.sort((a,b)=>ord[a.action]-ord[b.action] || b.value-a.value);
  return {out, total, secVal, unknown};
}
async function drawPortfolio(){
  const holdings = pfLoad(), el = $('#pfOut');
  if (!holdings.length){ el.innerHTML = '<div class="card empty">Add your holdings above to get BUY MORE / HOLD / REDUCE / EXIT advice with trailing stops and tax-aware notes.</div>'; return; }
  el.innerHTML = '<div class="card empty">Analysing…</div>';
  const {out, total, secVal, unknown} = await analyzePortfolio(holdings);
  const cost = out.reduce((a,p)=>a+p.cost,0), pnl = total-cost, P=PFC(), maxSW=P.max_sector_weight??.4;
  const held = new Set(out.map(p=>p.symbol)); const over = new Set(Object.entries(secVal).filter(([s,v])=>v/total>maxSW).map(([s])=>s));
  const ideas = D.rows.filter(r=>r.stance_code>=1 && !held.has(r.symbol) && !over.has(r.sector)).sort((a,b)=>b.score-a.score).slice(0,8);
  const regime = D.market.regime;
  const advice = regime>0 ? 'Bull market: stay invested, let winners run with trailing stops.' : regime===0 ? 'Sideways market: be selective, book profits faster, keep some cash.' : `Bear market: protect capital — aim for ~${fmt.p(P.bear_market_cash_target??.4,0)} cash, no averaging down.`;
  const cnt = a => out.filter(p=>p.action===a).length;
  el.innerHTML = `<div class="kpis">
      <div class="kpi"><div class="l">Market value</div><div class="v">Rs ${fmt.npr(total)}</div><div class="s">Cost Rs ${fmt.npr(cost)}</div></div>
      <div class="kpi"><div class="l">Unrealised P&amp;L</div><div class="v ${cls(pnl)}">Rs ${fmt.npr(pnl)}</div><div class="s ${cls(pnl)}">${fmt.sp(cost?pnl/cost:null)}</div></div>
      <div class="kpi"><div class="l">Regime</div><div class="v">${regimeBadge(regime)}</div><div class="s">${esc(advice)}</div></div>
      <div class="kpi"><div class="l">Actions</div><div class="v" style="font-size:15px"><span class="neg">${cnt('EXIT')} exit</span> · <span style="color:var(--amber)">${cnt('REDUCE')} reduce</span></div><div class="s"><span class="pos">${cnt('ADD')} buy more</span> · ${cnt('HOLD')} hold</div></div></div>
    ${unknown.length?`<div class="banner">Not found in the screener universe: ${unknown.map(esc).join(', ')}</div>`:''}
    <div class="card"><h3>Recommendations</h3><div class="tablewrap" style="max-height:none"><table>
      <tr><th>Stock</th><th>Action</th><th class="num">Qty</th><th class="num">WACC</th><th class="num">LTP</th><th class="num">P&amp;L</th><th class="num">Weight</th><th>Model</th><th class="num">Stop</th><th class="num">Net if sold</th><th>CGT</th><th>Reasoning</th><th></th></tr>
      ${out.map(p=>`<tr><td><a href="#" onclick="openStock('${p.symbol}');return false"><b>${p.symbol}</b></a><div class="small mut">${esc(p.r.sector)}</div></td>
        <td>${actionBadge(p.action)}${p.sellQty?`<div class="small">sell ${fmt.i(p.sellQty)}</div>`:''}</td><td class="num">${fmt.i(p.quantity)}</td><td class="num">${fmt.n(p.wacc)}</td><td class="num">${fmt.n(p.r.close)}</td>
        <td class="num ${cls(p.pnl)}">${fmt.npr(p.pnl)}<div class="small">${fmt.sp(p.pnlPct)}</div></td><td class="num">${fmt.p(p.weight,0)}</td>
        <td>${stanceBadge(p.r.stance_code)}<div class="small mut">score ${fmt.n(p.r.score,0)}</div></td><td class="num">${fmt.n(p.stop)}<div class="small mut" title="${esc(p.basis)}">${p.basis.startsWith('Super')?'Supertrend':'ATR trail'}</div></td>
        <td class="num">${fmt.npr(p.br.net)}<div class="small ${cls(p.br.profit)}">${fmt.npr(p.br.profit)}</div></td>
        <td class="small">${fmt.p(p.br.rate,2)}${p.days!==null?`<div class="mut">${p.days}d held${p.toLT?' · LT in '+p.toLT+'d':''}</div>`:''}</td>
        <td class="small" style="white-space:normal;min-width:260px">${esc(p.detail)}${p.notes.length?`<div class="mut">${p.notes.map(esc).join('<br>')}</div>`:''}</td>
        <td><button class="btn" onclick="pfDel('${p.symbol}')" title="remove">×</button></td></tr>`).join('')}</table></div>
      <div class="small mut" style="margin-top:6px">Net if sold = after commission, SEBON fee, DP charge and capital-gains tax at today's LTP. Stops update daily — a close below the stop triggers EXIT.</div></div>
    <div class="grid g2" style="margin-top:14px">
      <div class="card"><h3>Sector allocation <small>limit ${fmt.p(maxSW,0)} per sector</small></h3>
        ${Object.entries(secVal).sort((a,b)=>b[1]-a[1]).map(([s,v])=>`<div class="factor" style="grid-template-columns:170px 1fr 48px"><span>${esc(s)}</span><div class="bar"><i style="width:${v/total*100}%;background:${v/total>maxSW?C.red:C.blue}"></i></div><b>${fmt.p(v/total,0)}</b></div>`).join('')}</div>
      <div class="card"><h3>Ideas for new money <small>top-scored BUYs outside over-weight sectors</small></h3>
        ${ideas.length?`<table><tr><th>Stock</th><th>Sector</th><th class="num">LTP</th><th class="num">Score</th><th>Call</th></tr>${ideas.map(r=>`<tr class="click" onclick="openStock('${r.symbol}')"><td><b>${r.symbol}</b></td><td class="small mut">${esc(r.sector)}</td><td class="num">${fmt.n(r.close)}</td><td class="num">${fmt.n(r.score,0)}</td><td>${stanceBadge(r.stance_code)}</td></tr>`).join('')}</table>`
          : `<div class="empty">No BUY-rated candidates${regime<0?' (bear market: buying paused)':''}.</div>`}</div>
    </div>`;
}

render.track = function(){
  const T = D.tracking, el = $('#tab-track');
  if (!T){ el.innerHTML = '<div class="card empty">No tracking data yet.</div>'; return; }
  const src = T[state.trackSrc] || {}, H = state.trackH, hz = T.horizons || [5,20,60];
  const rows = src.by_stance || [], ic = src.ic || {};
  const buy = rows.filter(r=>r.direction>0), sell = rows.filter(r=>r.direction<0);
  const wavg = (rs, k) => { let n=0,s=0; rs.forEach(r=>{ if(isNum(r[k])){ s+=r[k]*r['n_'+H]; n+=r['n_'+H]; } }); return n?s/n:null; };
  const pfSyms = new Set(pfLoad().map(h=>h.symbol));
  const recent = (T.live.recent||[]); const mine = recent.filter(r=>pfSyms.has(r.symbol));
  el.innerHTML = `<div class="card"><div class="toolbar">
      <div class="seg" id="tSrc"><button data-v="live" class="${state.trackSrc==='live'?'on':''}">Live calls</button><button data-v="simulated" class="${state.trackSrc==='simulated'?'on':''}">Simulated history</button></div>
      <div class="seg" id="tH">${hz.map(h=>`<button data-v="${h}" class="${h===H?'on':''}">${h} sessions</button>`).join('')}</div>
      <span class="small mut right">${state.trackSrc==='live' ? `Logged since ${esc(src.first_date||'–')} · ${src.days_logged||0} days · ${fmt.i(src.calls)} calls (database: data/tracking/recommendations.csv)` : `Rebuilt from price history ${esc(src.first_date||'')} → ${esc(src.last_date||'')} (${esc(src.sampling||'')}) · ${fmt.i(src.calls)} calls`}</span></div>
    ${state.trackSrc==='live' && !(rows.some(r=>r['n_'+H]>0)) ? `<div class="banner">Live calls need ${H} trading sessions to be scored. The ledger grows every day; meanwhile the simulated history shows how the same model would have done.</div>`:''}
    <div class="kpis">
      <div class="kpi"><div class="l">BUY calls beat NEPSE</div><div class="v">${fmt.p(wavg(buy,'hit_'+H),0)}</div><div class="s">avg excess ${fmt.sp(wavg(buy,'avg_excess_'+H))}</div></div>
      <div class="kpi"><div class="l">SELL calls lagged NEPSE</div><div class="v">${fmt.p(wavg(sell,'hit_'+H),0)}</div><div class="s">avg excess ${fmt.sp(wavg(sell,'avg_excess_'+H))}</div></div>
      <div class="kpi"><div class="l">Information coefficient</div><div class="v">${fmt.n(ic.mean_ic,3)}</div><div class="s">score↔return rank corr. (${ic.horizon||T.main_horizon}d) · t ${fmt.n(ic.ic_t_stat,1)}</div></div>
      <div class="kpi"><div class="l">Top vs bottom quintile</div><div class="v" style="font-size:16px"><span class="${cls(ic.top_quintile_ret)}">${fmt.sp(ic.top_quintile_ret)}</span> / <span class="${cls(ic.bottom_quintile_ret)}">${fmt.sp(ic.bottom_quintile_ret)}</span></div><div class="s">avg ${ic.horizon||''}-session return</div></div>
    </div>
    <h3>Success rate by call <small>hit = BUY beat the NEPSE index / SELL lagged it over the next ${H} sessions</small></h3>
    <table><tr><th>Call</th><th class="num">Calls</th><th class="num">Scored</th><th class="num">Hit rate (vs NEPSE)</th><th class="num">Hit rate (absolute)</th><th class="num">Avg return</th><th class="num">Median return</th><th class="num">Avg excess vs NEPSE</th></tr>
      ${rows.map(r=>`<tr><td>${stanceBadge({'STRONG BUY':2,'BUY':1,'HOLD':0,'REDUCE':-1,'EXIT':-2}[r.label])}</td><td class="num">${fmt.i(r.calls)}</td><td class="num">${fmt.i(r['n_'+H])}</td>
        <td class="num"><b>${fmt.p(r['hit_'+H],0)}</b></td><td class="num">${fmt.p(r['abs_hit_'+H],0)}</td><td class="num ${cls(r['avg_ret_'+H])}">${fmt.sp(r['avg_ret_'+H])}</td><td class="num ${cls(r['med_ret_'+H])}">${fmt.sp(r['med_ret_'+H])}</td><td class="num ${cls(r['avg_excess_'+H])}">${fmt.sp(r['avg_excess_'+H])}</td></tr>`).join('')}</table>
    <div class="small mut" style="margin-top:6px">A useful model shows a clear staircase: STRONG BUY &gt; BUY &gt; HOLD &gt; REDUCE &gt; EXIT in average excess return, and an IC consistently above ~0.03.</div></div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><h3>Monthly hit rate of BUY calls <small>${T.main_horizon}-session horizon</small></h3><div id="tMonthly"></div></div>
    <div class="card"><h3>By sector &amp; by market regime <small>BUY calls, ${T.main_horizon} sessions</small></h3>
      <table><tr><th>Sector</th><th class="num">Calls</th><th class="num">Hit</th><th class="num">Avg excess</th></tr>${(src.by_sector||[]).map(r=>`<tr><td>${esc(r.sector)}</td><td class="num">${r.calls}</td><td class="num">${fmt.p(r.hit,0)}</td><td class="num ${cls(r.avg_excess)}">${fmt.sp(r.avg_excess)}</td></tr>`).join('')}</table>
      <table style="margin-top:10px"><tr><th>Regime</th><th class="num">Calls</th><th class="num">Hit</th><th class="num">Avg excess</th></tr>${(src.by_regime||[]).map(r=>`<tr><td>${regimeBadge(+r.regime)}</td><td class="num">${r.calls}</td><td class="num">${fmt.p(r.hit,0)}</td><td class="num ${cls(r.avg_excess)}">${fmt.sp(r.avg_excess)}</td></tr>`).join('')}</table></div>
  </div>
  <div class="card" style="margin-top:14px"><h3>Live strategy signals <small>forward performance of each strategy's real-time entries/picks</small></h3>
    ${Object.keys(T.strategies_live||{}).length ? `<table><tr><th>Strategy</th><th>Signal</th><th class="num">Count</th>${hz.map(h=>`<th class="num">Hit ${h}d</th><th class="num">Avg ex ${h}d</th>`).join('')}</tr>
      ${Object.entries(T.strategies_live).flatMap(([sid,v])=>v.by_signal.filter(r=>r.direction!==0).map(r=>`<tr><td>${esc((D.strategies||[]).find(s=>s.id===sid)?.name||sid)}</td><td>${r.label}</td><td class="num">${r.calls}</td>${hz.map(h=>`<td class="num">${fmt.p(r['hit_'+h],0)}</td><td class="num ${cls(r['avg_excess_'+h])}">${fmt.sp(r['avg_excess_'+h])}</td>`).join('')}</tr>`)).join('')}</table>` : '<div class="empty">Strategy signals are logged daily and scored once enough sessions have passed.</div>'}</div>
  <div class="card" style="margin-top:14px"><h3>Recent live calls &amp; outcomes ${pfSyms.size?`<small>${mine.length} on your holdings</small>`:''}</h3>
    <div class="toolbar"><label class="small"><input type="checkbox" id="tMine" ${state.trackMine?'checked':''}> Only my holdings</label></div>
    <div class="tablewrap" style="max-height:460px"><table><tr><th>Date</th><th>Stock</th><th>Call</th><th class="num">Score</th><th class="num">Price</th>${hz.map(h=>`<th class="num">${h}d return</th><th class="num">${h}d vs NEPSE</th>`).join('')}</tr>
      ${(state.trackMine?mine:recent).slice(0,300).map(r=>`<tr><td>${r.date}</td><td><b>${r.symbol}</b></td><td>${stanceBadge({'STRONG BUY':2,'BUY':1,'HOLD':0,'REDUCE':-1,'EXIT':-2}[r.stance])}</td><td class="num">${fmt.n(r.score,0)}</td><td class="num">${fmt.n(r.close)}</td>${hz.map(h=>`<td class="num ${cls(r['ret_'+h])}">${isNum(r['ret_'+h])?fmt.sp(r['ret_'+h]):'<span class="mut">pending</span>'}</td><td class="num ${cls(r['excess_'+h])}">${fmt.sp(r['excess_'+h])}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="9" class="empty">No live calls logged yet.</td></tr>`}</table></div></div>`;
  $('#tSrc').onclick = e => { if(e.target.dataset.v){ state.trackSrc=e.target.dataset.v; render.track(); } };
  $('#tH').onclick = e => { if(e.target.dataset.v){ state.trackH=+e.target.dataset.v; render.track(); } };
  $('#tMine').onchange = e => { state.trackMine = e.target.checked; render.track(); };
  const mo = src.monthly||[];
  if (mo.length) makeChart($('#tMonthly'), {x:mo.map(m=>m.month), xlen:7, height:260, panels:[{fixed:[0,1], yfmt:v=>(v*100).toFixed(0)+'%', hlines:[{v:.5,color:'#9AA5B1'}],
    series:[{type:'bar', y:mo.map(m=>m.hit), colors:mo.map(m=>m.hit>=.5?'rgba(30,142,62,.7)':'rgba(237,27,36,.65)'), name:'Hit rate', fmt:v=>fmt.p(v,0)},{y:mo.map(m=>m.calls),noTip:false,name:'Calls',fmt:v=>fmt.i(v),color:'transparent',w:0}]}]});
  else $('#tMonthly').innerHTML='<div class="empty">Not enough resolved calls yet.</div>';
};
