<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEPSE Screener</title>
<meta name="theme-color" content="#0B1F3F">
<meta name="description" content="NEPSE technical and fundamental screener, strategies, portfolio advice and track record">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------------------------------------------------------------- tokens */
:root{
  --font: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --cond: "Barlow Condensed", "Barlow", "Arial Narrow", system-ui, sans-serif;
  --code: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --brand:#0C4DA1; --brandred:#ED1B24;
  --r-lg:16px; --r-md:10px; --r-sm:7px;
  --side:76px;
}
body.dark{
  --bg:#0B1F3F; --panel:#10284D; --panel2:#153160; --raise:#1A3A70; --line:#21427A; --grid:rgba(143,163,192,.13);
  --text:#E8EEF7; --mut:#8FA3C0; --faint:#5F7699;
  --blue:#4A88E8; --blue-soft:rgba(74,136,232,.16); --up:#34C77B; --up-soft:rgba(52,199,123,.15);
  --down:#FF5A61; --down-soft:rgba(255,90,97,.15); --amber:#F2A93B; --amber-soft:rgba(242,169,59,.16);
  --ridge1:#163A6E; --ridge2:#1D4A8A; --up-mid:rgba(52,199,123,.5); --down-mid:rgba(255,90,97,.5); --snow:#D9E7FF; --shadow:0 18px 50px rgba(2,8,20,.55);
  color-scheme: dark;
}
body.light{
  --bg:#EDF1F7; --panel:#FFFFFF; --panel2:#F5F8FC; --raise:#E7EEF8; --line:#D8E0EC; --grid:rgba(11,31,63,.07);
  --text:#0B1F3F; --mut:#5B6B85; --faint:#8A98AE;
  --blue:#0C4DA1; --blue-soft:rgba(12,77,161,.09); --up:#1C8A45; --up-soft:rgba(28,138,69,.1);
  --down:#D7141C; --down-soft:rgba(215,20,28,.08); --amber:#B86A00; --amber-soft:rgba(184,106,0,.1);
  --ridge1:#C9D8EE; --ridge2:#A9C2E6; --up-mid:rgba(28,138,69,.42); --down-mid:rgba(215,20,28,.38); --snow:#0C4DA1; --shadow:0 18px 50px rgba(11,31,63,.18);
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:15px/1.45 var(--font);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
a{color:var(--blue);text-decoration:none} a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.num{font-family:var(--cond);font-variant-numeric:tabular-nums;letter-spacing:.2px}
.up{color:var(--up)} .down{color:var(--down)} .mut{color:var(--mut)} .faint{color:var(--faint)}
.hide{display:none!important}

/* ---------------------------------------------------------------- shell */
#app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
#side{position:sticky;top:0;height:100vh;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:14px 0 12px;gap:4px;z-index:30}
#side .logo{width:44px;height:44px;margin-bottom:14px;display:grid;place-items:center}
.navbtn{width:62px;border:0;background:none;border-radius:12px;padding:9px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--mut);font-size:11px;font-weight:600}
.navbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.navbtn:hover{color:var(--text);background:var(--raise)}
.navbtn.on{color:#fff;background:var(--brand)}
body.light .navbtn.on{color:#fff}
#side .grow{flex:1}
#main{min-width:0;display:flex;flex-direction:column}
#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:12px 26px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
#searchBtn{flex:0 1 420px;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:8px 12px;color:var(--mut);cursor:pointer;text-align:left}
#searchBtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2}
#searchBtn kbd{margin-left:auto}
kbd{font:600 11px var(--font);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--mut);background:var(--panel2)}
.mkt-pill{display:flex;align-items:center;gap:10px;margin-left:auto;white-space:nowrap}
.mkt-pill .idx{font:600 20px var(--cond)}
.iconbtn{width:38px;height:38px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;color:var(--mut)}
.iconbtn:hover{color:var(--text)}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{padding:22px 26px 60px;max-width:1560px;width:100%}
.pagehead{display:flex;align-items:flex-end;gap:16px;margin:0 0 16px;flex-wrap:wrap}
.pagehead h1{font:600 30px/1.1 var(--cond);margin:0;letter-spacing:.2px}
.pagehead p{margin:0;color:var(--mut);max-width:70ch}
.notice{border:1px solid var(--line);border-left:3px solid var(--amber);background:var(--amber-soft);padding:9px 14px;border-radius:var(--r-sm);margin-bottom:12px;font-size:14px}
.notice.demo{border-left-color:var(--brandred);background:var(--down-soft)}

/* ---------------------------------------------------------------- surfaces */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;min-width:0}
.panel h2{font:600 19px/1.2 var(--cond);margin:0 0 4px;letter-spacing:.2px}
.panel .sub{color:var(--mut);font-size:13px;margin:0 0 12px}
.panel-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px}
.panel-head > div:first-child{flex:1;min-width:0}
.grid{display:grid;gap:16px}
.cols-2{grid-template-columns:repeat(auto-fit,minmax(440px,1fr))}
.cols-3{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.split{grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr)}
.mt{margin-top:16px}

/* stat strip: one row of figures separated by rules, not boxed cards */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.strip > div{padding:13px 16px;border-right:1px solid var(--line)}
.strip > div:last-child{border-right:0}
.strip .k{font-size:12.5px;color:var(--mut)}
.strip .v{font:600 25px/1.15 var(--cond);margin-top:2px}
.strip .s{font-size:12.5px;color:var(--mut)}

/* ---------------------------------------------------------------- controls */
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:var(--r-sm);padding:7px 12px;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--blue)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.danger{color:var(--down)}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
input,select{font:inherit;font-size:14px;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 10px}
input::placeholder{color:var(--faint)}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-sm);padding:2px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:5px;font-weight:600;font-size:13px;color:var(--mut);cursor:pointer}
.seg button.on{background:var(--raise);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;background:var(--blue-soft);color:var(--blue);border:0;cursor:pointer}
.chip.off{background:transparent;color:var(--mut);box-shadow:inset 0 0 0 1px var(--line)}
.star{border:0;background:none;cursor:pointer;color:var(--faint);font-size:17px;line-height:1;padding:2px}
.star.on{color:#F5B83D}

/* calls */
.call{display:inline-block;border-radius:6px;padding:2px 8px;font:700 12px/1.5 var(--font);letter-spacing:.2px;white-space:nowrap}
.c2{background:var(--up);color:#06210F}.c1{background:var(--up-soft);color:var(--up)}.c0{background:var(--raise);color:var(--mut)}
.c-1{background:var(--amber-soft);color:var(--amber)}.c-2{background:var(--down);color:#fff}
.reg{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px}
.reg i{width:9px;height:9px;border-radius:50%;display:inline-block}

/* ---------------------------------------------------------------- tables */
.tbl{overflow:auto;border-radius:var(--r-md);border:1px solid var(--line);max-height:72vh}
table{width:100%;border-collapse:collapse;font-size:14px}
th{position:sticky;top:0;z-index:1;background:var(--panel2);color:var(--mut);font-weight:600;font-size:12.5px;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
td{padding:8px 10px;border-bottom:1px solid var(--grid);white-space:nowrap}
th.r,td.r{text-align:right}
td.num,th.num{text-align:right}
tbody tr.row{cursor:pointer}
tbody tr.row:hover td{background:var(--blue-soft)}
td .sym{font-weight:700}
td .nm{display:block;font-size:12px;color:var(--mut);max-width:190px;overflow:hidden;text-overflow:ellipsis}
.plain th{position:static;background:none;border-bottom:1px solid var(--line);cursor:default}
.plain td{border-bottom:1px solid var(--grid)}

/* ---------------------------------------------------------------- market hero */
.hero{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.hero-top{position:absolute;inset:0 0 auto 0;padding:18px 22px;display:flex;align-items:flex-start;gap:24px;z-index:2;pointer-events:none}
.hero-top .lbl{font-size:14px;color:var(--mut)}
.hero-top .big{font:600 58px/1 var(--cond);letter-spacing:-.5px}
.hero-top .chg{font:600 20px var(--cond);margin-top:4px}
.hero-top .seg{pointer-events:auto;margin-left:auto}
.hero-legend{display:flex;gap:16px;font-size:12.5px;color:var(--mut);padding:0 22px 12px;flex-wrap:wrap}
.hero-legend i{display:inline-block;width:12px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}

/* heatmap */
.heat{position:relative;height:520px;border-radius:var(--r-md);overflow:hidden;background:#0B1F3F}
.heat .sec{position:absolute;border:1px solid #0B1F3F;box-sizing:border-box}
.heat .sec > span{position:absolute;left:5px;top:3px;font-size:11.5px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.55);z-index:2;pointer-events:none;white-space:nowrap}
.heat .tile{position:absolute;box-sizing:border-box;border:1px solid rgba(11,31,63,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;cursor:pointer;overflow:hidden;text-shadow:0 1px 2px rgba(0,0,0,.45)}
.heat .tile b{font:600 14px/1.1 var(--cond)} .heat .tile small{font:600 12px var(--cond);opacity:.95}
.heat .tile:hover{outline:2px solid #fff;outline-offset:-2px;z-index:3}
.scale{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut)}
.scale div{width:150px;height:8px;border-radius:4px;background:linear-gradient(90deg,#C3242B,#6B2F45,#2A3F66,#1F6B4B,#20A35B)}

/* lists */
.pick{display:grid;grid-template-columns:auto 1fr auto auto;gap:4px 12px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--grid);cursor:pointer}
.pick:hover{background:var(--blue-soft)}
.pick .score{font:600 22px var(--cond);text-align:right;min-width:34px}
.bar{height:6px;background:var(--raise);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}

/* ---------------------------------------------------------------- screener */
.scr{display:grid;grid-template-columns:270px minmax(0,1fr);gap:16px;align-items:start}
.rail{position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto;padding:12px}
.rail h3{font:600 14px var(--font);color:var(--mut);margin:12px 6px 6px}
.rail h3:first-child{margin-top:2px}
.rail button.it{display:flex;width:100%;justify-content:space-between;gap:8px;border:0;background:none;text-align:left;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:13.5px;color:var(--text)}
.rail button.it:hover{background:var(--raise)}
.rail button.it.on{background:var(--blue-soft);color:var(--blue);font-weight:600}
.rail button.it span:last-child{color:var(--mut);font:600 13px var(--cond)}
.rule{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

/* watchlist tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tile-w{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;cursor:pointer}
.tile-w:hover{border-color:var(--blue)}
.tile-w .row1{display:flex;align-items:baseline;gap:8px}
.tile-w .px{font:600 24px var(--cond);margin-left:auto}

/* ---------------------------------------------------------------- drawer */
#drawerBg{position:fixed;inset:0;background:rgba(3,10,24,.55);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
#drawer{position:fixed;top:0;right:0;height:100vh;width:min(1040px,100vw);background:var(--bg);border-left:1px solid var(--line);z-index:61;transform:translateX(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:var(--shadow)}
body.drawer-open #drawerBg{opacity:1;pointer-events:auto}
body.drawer-open #drawer{transform:none}
#drawer .dh{padding:16px 22px 0;border-bottom:1px solid var(--line);background:var(--panel)}
#drawer .db{overflow:auto;padding:18px 22px 40px;flex:1}
.dtitle{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dtitle h2{font:600 32px/1 var(--cond);margin:0}
.dtitle .px{font:600 30px/1 var(--cond)}
.tabs{display:flex;gap:2px;margin-top:12px}
.tabs button{border:0;background:none;padding:9px 14px;font-weight:600;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent}
.tabs button.on{color:var(--text);border-bottom-color:var(--brandred)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:2px 22px}
.kv div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--grid);font-size:14px}
.kv span{color:var(--mut)} .kv b{font:600 15px var(--cond)}
.factor{display:grid;grid-template-columns:96px 1fr 34px;align-items:center;gap:10px;margin:7px 0;font-size:14px}
.factor b{font:600 16px var(--cond);text-align:right}
ul.why{margin:0;padding-left:18px} ul.why li{margin:4px 0}

/* ---------------------------------------------------------------- charts */
.chart{position:relative;width:100%}
.chart canvas{display:block;width:100%}
.tip{position:absolute;pointer-events:none;background:var(--panel2);border:1px solid var(--line);color:var(--text);font-size:12.5px;padding:7px 10px;border-radius:8px;white-space:nowrap;display:none;z-index:5;line-height:1.55;box-shadow:var(--shadow)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);margin:2px 0 8px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:3px}

/* ---------------------------------------------------------------- palette */
#pal{position:fixed;inset:0;z-index:80;background:rgba(3,10,24,.5);display:none;align-items:flex-start;justify-content:center;padding-top:12vh}
#pal.open{display:flex}
#pal .box{width:min(640px,94vw);background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
#pal input{width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:16px 18px;font-size:17px;background:transparent}
#pal input:focus{outline:none}
#pal .res{max-height:52vh;overflow:auto;padding:6px}
#pal .res .g{font-size:12px;color:var(--faint);padding:8px 12px 4px}
#pal .res .o{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;cursor:pointer}
#pal .res .o.sel{background:var(--blue-soft)}
#pal .res .o .r{margin-left:auto;color:var(--mut);font-size:13px}
#pal .foot{display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--faint)}

#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:var(--r-md);box-shadow:var(--shadow);opacity:0;transition:.2s;z-index:90;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%)}
pre{font:12.5px/1.5 var(--code);background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;white-space:pre-wrap;margin:0}
code{font:12.5px var(--code);background:var(--panel2);padding:1px 5px;border-radius:4px}
.empty{padding:34px 20px;text-align:center;color:var(--mut)}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:4px}
#bottomnav{display:none}

/* ---------------------------------------------------------------- responsive */
@media (max-width:1100px){.split{grid-template-columns:1fr}.scr{grid-template-columns:1fr}.rail{position:static;max-height:none}}
@media (max-width:760px){
  #app{grid-template-columns:1fr}
  #side{display:none}
  #top{padding:10px 14px;gap:8px}
  #searchBtn kbd,.mkt-pill .lbl-date{display:none}
  main{padding:14px 12px 96px}
  .cols-2,.cols-3{grid-template-columns:1fr}
  .hero-top .big{font-size:42px}
  .hero-top{position:static;flex-wrap:wrap;gap:8px;padding:14px 16px 4px}
  .hero-top .seg{margin-left:0}
  #searchBtn{flex:0 0 auto;padding:9px}
  #searchBtn span{display:none}
  .mkt-pill{gap:7px}
  .mkt-pill .idx{font-size:18px}
  #bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--panel);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom));justify-content:space-around}
  #bottomnav .navbtn{width:auto;flex:1;font-size:10.5px}
  .heat{height:340px}
  #drawer .db,#drawer .dh{padding-left:14px;padding-right:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

    <div class="grow"></div>
    <button class="navbtn hide" id="installBtn" title="Install as an app"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>Install</button>

  <div id="main">
    <header id="top">
      <button id="searchBtn" aria-label="Search (Ctrl+K)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span>Search stocks, screens, pages</span><kbd>Ctrl K</kbd></button>
      <div class="mkt-pill" id="mktPill"></div>

    <main>
      <div id="notices"></div>

      <section id="pg-strategies" class="hide"></section>
      <section id="pg-portfolio" class="hide"></section>

</div>
<div id="drawerBg"></div>

<div id="toast"></div>

<script>
/* ======================================================================
   Data
   ====================================================================== */
const D = {}, HIST = {};
async function getJSON(name){
  if (window.EMBED && window.EMBED[name] !== undefined) return window.EMBED[name];
  const r = await fetch('data/' + name + '.json', {cache:'no-cache'});
  if (!r.ok) throw new Error(name + ': HTTP ' + r.status);
  return r.json();
}
async function getHistory(sym){
  if (sym in HIST) return HIST[sym];
  try { HIST[sym] = await getJSON('history/' + sym); } catch(e){ HIST[sym] = null; }
  return HIST[sym];
}
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isNum = v => typeof v === 'number' && isFinite(v);
const fmt = {
  n:(v,d=2)=>isNum(v)?v.toLocaleString('en-IN',{minimumFractionDigits:d,maximumFractionDigits:d}):'–',
  i:v=>isNum(v)?Math.round(v).toLocaleString('en-IN'):'–',
  p:(v,d=1)=>isNum(v)?(v*100).toFixed(d)+'%':'–',
  sp:(v,d=1)=>isNum(v)?(v>0?'+':v<0?'−':'')+Math.abs(v*100).toFixed(d)+'%':'–',
  npr:v=>{ if(!isNum(v)) return '–'; const a=Math.abs(v), s=v<0?'−':'';
    if(a>=1e9) return s+(a/1e9).toFixed(2)+' Arab'; if(a>=1e7) return s+(a/1e7).toFixed(2)+' Cr'; if(a>=1e5) return s+(a/1e5).toFixed(2)+' L'; return s+Math.round(a).toLocaleString('en-IN'); },
};
const tone = v => isNum(v) ? (v>0?'up':v<0?'down':'') : '';
const STANCE = {2:'Strong buy',1:'Buy',0:'Hold','-1':'Reduce','-2':'Exit'};
const STANCE_CODE = {'STRONG BUY':2,'BUY':1,'HOLD':0,'REDUCE':-1,'EXIT':-2};
const call = c => isNum(c) ? `<span class="call c${c}">${STANCE[c]}</span>` : '<span class="call c0">n/a</span>';
const ACT = {EXIT:['Exit','c-2'],REDUCE:['Reduce','c-1'],HOLD:['Hold','c0'],ADD:['Buy more','c1']};
const actCall = a => `<span class="call ${ACT[a][1]}">${ACT[a][0]}</span>`;
const regime = r => { const [l,c] = r>0?['Bull','var(--up)']:r<0?['Bear','var(--down)']:['Neutral','var(--amber)']; return `<span class="reg"><i style="background:${c}"></i>${l}</span>`; };
const css = n => getComputedStyle(document.body).getPropertyValue(n).trim();
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200); }
function store(k, v){ try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); }catch(e){ window['__'+k]=v===undefined?window['__'+k]:v; return window['__'+k]; } }

/* ======================================================================
   Icons & navigation
   ====================================================================== */
const ICON = {
  market:'<path d="M3 17l5-6 4 4 8-9"/><path d="M14 6h6v6"/>',
  screener:'<path d="M4 5h16l-6 7v6l-4 2v-8z"/>',
  sectors:'<rect x="3" y="3" width="8" height="10" rx="1.5"/><rect x="13" y="3" width="8" height="6" rx="1.5"/><rect x="13" y="11" width="8" height="10" rx="1.5"/><rect x="3" y="15" width="8" height="6" rx="1.5"/>',
  watch:'<path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/>',
  strategies:'<path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4A2 2 0 0 0 19 18l-5-9V3"/><path d="M7.5 14h9"/>',
  portfolio:'<path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/>',
  track:'<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor"/>',
  help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17.5h.01"/>',
};
const PAGES = [['market','Market'],['screener','Screener'],['sectors','Sectors'],['watch','Watchlist'],['strategies','Strategies'],['portfolio','Portfolio'],['track','Track record'],['help','Help']];
const navHTML = (mobile) => PAGES.filter(p=>!mobile||!['help','sectors'].includes(p[0])).map(([id,l])=>`<button class="navbtn" data-pg="${id}" title="${l}"><svg viewBox="0 0 24 24">${ICON[id]}</svg>${mobile&&l==='Track record'?'Record':l}</button>`).join('');
$('#navTop').innerHTML = navHTML(false); $('#bottomnav').innerHTML = navHTML(true);
$$('.navbtn[data-pg]').forEach(b => b.onclick = () => go(b.dataset.pg));
const S = { page:'market', range:250, screen:'', sector:'', stance:'', liquid:true, q:'', filters:[], cols:'overview', sort:{k:'score',d:-1},
            strat:null, stab:'overview', trackSrc:'simulated', trackH:20, trackMine:false, movers:'gainers', dtab:'chart', dtf:126,
            ind:{e20:true,e50:true,s200:true,bb:false,st:true}, panes:{vol:true,rsi:true,macd:false} };
const R = {};
function go(pg){
  S.page = pg; $$('.navbtn[data-pg]').forEach(b => b.classList.toggle('on', b.dataset.pg===pg));
  $$('main > section').forEach(s => s.classList.toggle('hide', s.id !== 'pg-'+pg));
  if (location.hash.slice(1) !== pg) history.replaceState(null,'','#'+pg);
  R[pg] && R[pg](); window.scrollTo({top:0});
}

/* theme */
function setTheme(t){ document.body.className = document.body.className.replace(/\b(dark|light)\b/g,'').trim() + ' ' + t; store('nepse_theme', t);
  document.querySelector('meta[name=theme-color]').content = t==='dark' ? '#0B1F3F' : '#EDF1F7';
  $('#themeBtn').innerHTML = t==='dark' ? '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>' : '<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>'; }
$('#themeBtn').onclick = () => { setTheme(document.body.classList.contains('dark') ? 'light' : 'dark'); if (D.meta) { R[S.page] && R[S.page](); if (document.body.classList.contains('drawer-open')) drawDrawer(); } };
setTheme(store('nepse_theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));

/* watchlist */
const WKEY = 'nepse_watchlist_v1';
const watch = () => new Set(store(WKEY) || []);
function toggleWatch(sym, ev){ ev && ev.stopPropagation(); const w = watch(); w.has(sym) ? w.delete(sym) : w.add(sym); store(WKEY, [...w]);
  toast(w.has(sym) ? `${sym} added to watchlist` : `${sym} removed from watchlist`); $$(`.star[data-s="${sym}"]`).forEach(b => b.classList.toggle('on', w.has(sym))); if (S.page==='watch') R.watch(); }
const starBtn = sym => `<button class="star ${watch().has(sym)?'on':''}" data-s="${sym}" onclick="toggleWatch('${sym}',event)" aria-label="Watch ${sym}">★</button>`;

/* ======================================================================
   Sparkline (SVG) and canvas charts
   ====================================================================== */
function spark(arr, w=84, h=24){
  const v = (arr||[]).filter(isNum); if (v.length < 2) return '';
  const lo=Math.min(...v), hi=Math.max(...v), r=hi-lo||1;
  const pts = v.map((x,i)=>`${(i/(v.length-1)*w).toFixed(1)},${(h-2-(x-lo)/r*(h-4)).toFixed(1)}`).join(' ');
  const c = v[v.length-1] >= v[0] ? 'var(--up)' : 'var(--down)';
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${c}" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
}
function makeChart(host, opt){
  host.innerHTML=''; host.classList.add('chart');
  const cv=document.createElement('canvas'), tip=document.createElement('div'); tip.className='tip'; host.append(cv, tip);
  const H = opt.height || 300;
  const col = c => c && c.startsWith('--') ? css(c) : c;
  function draw(hover){
    const W=host.clientWidth||600, dpr=window.devicePixelRatio||1; cv.width=W*dpr; cv.height=H*dpr; cv.style.height=H+'px';
    const g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,H);
    const gridC=css('--grid'), mutC=css('--faint'); g.font='12px Barlow, system-ui'; g.textBaseline='middle';
    const n=opt.x.length, L=opt.left??8, Rr=opt.right??60, plotW=W-L-Rr;
    const xp = opt.cat ? (i => L + (i+.5)*plotW/n) : (i => L + (n<=1 ? plotW/2 : i*plotW/(n-1)));
    let top=10; const totF=opt.panels.reduce((a,p)=>a+(p.h||1),0), gap=16, usable=H-26-gap*(opt.panels.length-1)-10;
    const lay=[];
    opt.panels.forEach(p=>{
      const ph=usable*(p.h||1)/totF, y0=top, y1=top+ph; top=y1+gap;
      let lo=Infinity, hi=-Infinity;
      p.series.forEach(s=>{ if(s.type==='candle'){ for(let i=0;i<n;i++){ if(isNum(s.l[i])) lo=Math.min(lo,s.l[i]); if(isNum(s.h[i])) hi=Math.max(hi,s.h[i]); } } else (s.y||[]).forEach(v=>{ if(isNum(v)){ lo=Math.min(lo,v); hi=Math.max(hi,v);} }); });
      if(p.fixed){ lo=p.fixed[0]; hi=p.fixed[1]; } if(!isFinite(lo)){ lo=0; hi=1; } if(hi===lo){ hi+=1; lo-=1; }
      const lo0=lo; if(!p.fixed){ const pad=(hi-lo)*.07; lo-=pad; hi+=pad; } if(p.zero) lo = lo0>=0 ? 0 : lo;
      const yp=v=>y1-(v-lo)/(hi-lo)*(y1-y0); lay.push({p,y0,y1,yp});
      const ticks=Math.max(2,Math.round((y1-y0)/48));
      g.strokeStyle=gridC; g.fillStyle=mutC; g.lineWidth=1; g.textAlign='left';
      for(let t=0;t<=ticks;t++){ const v=lo+(hi-lo)*t/ticks, y=yp(v); g.beginPath(); g.moveTo(L,y); g.lineTo(W-Rr,y); g.stroke();
        g.fillText((p.yfmt||(x=>Math.abs(x)>=1000?Math.round(x).toLocaleString('en-IN'):x.toFixed(Math.abs(x)<10?2:1)))(v), W-Rr+8, y); }
      (p.hlines||[]).forEach(h=>{ const y=yp(h.v); g.strokeStyle=col(h.c)||mutC; g.setLineDash([4,4]); g.beginPath(); g.moveTo(L,y); g.lineTo(W-Rr,y); g.stroke(); g.setLineDash([]); });
      p.series.forEach(s=>{
        if(s.type==='candle'){ const bw=Math.max(1,Math.min(9,plotW/n*.68)), up=css('--up'), dn=css('--down');
          for(let i=0;i<n;i++){ if(!isNum(s.c[i])) continue; const u=s.c[i]>=s.o[i]; g.strokeStyle=g.fillStyle=u?up:dn; const x=xp(i);
            g.beginPath(); g.moveTo(x,yp(s.h[i])); g.lineTo(x,yp(s.l[i])); g.stroke(); const a=yp(s.o[i]), b=yp(s.c[i]); g.fillRect(x-bw/2,Math.min(a,b),bw,Math.max(1,Math.abs(b-a))); } }
        else if(s.type==='bar'){ const bw=Math.max(1,plotW/n*(opt.cat?.6:.72)), z=yp(Math.max(lo,0));
          for(let i=0;i<n;i++){ const v=s.y[i]; if(!isNum(v)) continue; g.fillStyle=col(s.colors?s.colors[i]:(s.c||(v>=0?'--up':'--down'))); const y=yp(v); g.fillRect(xp(i)-bw/2,Math.min(y,z),bw,Math.max(1,Math.abs(z-y))); } }
        else if(s.type==='dots'){ for(let i=0;i<n;i++){ const v=s.y[i]; if(!isNum(v)) continue; g.fillStyle=col(s.colors?s.colors[i]:s.c); g.beginPath(); g.arc(xp(i),yp(v),s.r||1.5,0,7); g.fill(); } }
        else if(s.type==='band'){ g.fillStyle=col(s.c); g.beginPath(); let st=false; for(let i=0;i<n;i++){ if(!isNum(s.hi[i])) continue; const x=xp(i), y=yp(s.hi[i]); st?g.lineTo(x,y):(g.moveTo(x,y),st=true);} for(let i=n-1;i>=0;i--){ if(!isNum(s.lo[i])) continue; g.lineTo(xp(i),yp(s.lo[i])); } g.closePath(); g.fill(); }
        else { const c=col(s.c||'--blue'); g.strokeStyle=c; g.lineWidth=s.w||1.6; g.setLineDash(s.dash||[]);
          const pts=[]; for(let i=0;i<n;i++){ const v=s.y[i]; if(isNum(v)) pts.push([xp(i),yp(v)]); }
          if(s.area && pts.length){ const gr=g.createLinearGradient(0,y0,0,y1); gr.addColorStop(0,col(s.area)); gr.addColorStop(1,'rgba(0,0,0,0)');
            g.fillStyle=gr; g.beginPath(); g.moveTo(pts[0][0],y1); pts.forEach(q=>g.lineTo(q[0],q[1])); g.lineTo(pts[pts.length-1][0],y1); g.closePath(); g.fill(); }
          g.beginPath(); let st=false; for(let i=0;i<n;i++){ const v=s.y[i]; if(!isNum(v)){ st=false; continue; } const x=xp(i), y=yp(v); st?g.lineTo(x,y):(g.moveTo(x,y),st=true); } g.stroke(); g.setLineDash([]); }
      });
      if(p.title){ g.fillStyle=css('--mut'); g.font='600 12px Barlow, system-ui'; g.fillText(p.title, L+2, y0+7); g.font='12px Barlow, system-ui'; }
    });
    g.fillStyle=mutC; g.textAlign='center'; const step=opt.cat&&n<=8?1:Math.max(1,Math.ceil(n/Math.max(2,Math.floor(plotW/(opt.cat?60:96)))));
    for(let i=0;i<n;i+=step) g.fillText(String(opt.x[i]).slice(0,opt.xlen||10), xp(i), H-10);
    if(hover!==undefined && hover>=0 && hover<n){ const x=xp(hover); g.strokeStyle=css('--mut'); g.globalAlpha=.5; g.setLineDash([3,3]); g.beginPath(); g.moveTo(x,6); g.lineTo(x,H-22); g.stroke(); g.setLineDash([]); g.globalAlpha=1;
      let html=`<b>${esc(opt.x[hover])}</b>`;
      lay.forEach(({p})=>p.series.forEach(s=>{ if(s.noTip) return;
        if(s.type==='candle') html+=`<br>O ${fmt.n(s.o[hover])}  H ${fmt.n(s.h[hover])}  L ${fmt.n(s.l[hover])}  C <b>${fmt.n(s.c[hover])}</b>`;
        else if(s.name && s.y) html+=`<br><span style="color:${col(s.tc||s.c||'--blue')}">●</span> ${esc(s.name)}: ${(s.fmt||p.tf||(v=>fmt.n(v)))(s.y[hover])}`; }));
      tip.innerHTML=html; tip.style.display='block'; const tw=tip.offsetWidth; tip.style.left=Math.min(W-tw-6,Math.max(6,x+14))+'px'; tip.style.top='8px';
    } else tip.style.display='none';
  }
  draw();
  const pick = e => { const r=cv.getBoundingClientRect(), L=opt.left??8, Rr=opt.right??60, n=opt.x.length, w=r.width-L-Rr;
    const i = opt.cat ? Math.floor((e.clientX-r.left-L)/(w/n)) : Math.round((e.clientX-r.left-L)/(w/Math.max(1,n-1))); return Math.max(0,Math.min(n-1,i)); };
  cv.addEventListener('mousemove', e => draw(pick(e))); cv.addEventListener('mouseleave', () => draw());
  cv.addEventListener('touchmove', e => { draw(pick(e.touches[0])); }, {passive:true});
  new ResizeObserver(() => draw()).observe(host);
}

/* The market "ridge": index, 50-EMA and 200-SMA drawn as layered silhouettes,
   with the regime as a coloured ground strip. */
function ridgeChart(host, s, n){
  host.innerHTML=''; host.classList.add('chart'); const cv=document.createElement('canvas'), tip=document.createElement('div'); tip.className='tip'; host.append(cv,tip);
  const H = innerWidth < 760 ? 240 : 380;
  const d=s.d.slice(-n), ix=s.index.slice(-n), fa=s.fast.slice(-n), sl=s.slow.slice(-n), rg=s.regime.slice(-n);
  function draw(hover){
    const W=host.clientWidth||900, dpr=window.devicePixelRatio||1; cv.width=W*dpr; cv.height=H*dpr; cv.style.height=H+'px';
    const g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
    const L=0, Rr=62, T=innerWidth<760?14:H*.30, B=H-34, plotW=W-L-Rr, N=d.length;
    const all=[...ix,...fa,...sl].filter(isNum); let lo=Math.min(...all), hi=Math.max(...all); const pad=(hi-lo)*.06; lo-=pad; hi+=pad;
    const xp=i=>L+i*plotW/Math.max(1,N-1), yp=v=>B-(v-lo)/(hi-lo)*(B-T);
    g.font='12px Barlow, system-ui'; g.textBaseline='middle'; g.fillStyle=css('--faint'); g.strokeStyle=css('--grid'); g.lineWidth=1;
    for(let t=0;t<=4;t++){ const v=lo+(hi-lo)*t/4, y=yp(v); g.beginPath(); g.moveTo(0,y); g.lineTo(W-Rr,y); g.stroke(); g.textAlign='left'; g.fillText(Math.round(v).toLocaleString('en-IN'), W-Rr+8, y); }
    const ridge=(arr,fill)=>{ g.beginPath(); g.moveTo(xp(0),B); let lastX=xp(0); arr.forEach((v,i)=>{ if(isNum(v)){ g.lineTo(xp(i),yp(v)); lastX=xp(i);} }); g.lineTo(lastX,B); g.closePath(); g.fillStyle=fill; g.fill(); };
    ridge(sl, css('--ridge1')); ridge(fa, css('--ridge2'));
    const gr=g.createLinearGradient(0,T,0,B); const blue=css('--blue'); gr.addColorStop(0, blue+'CC'); gr.addColorStop(1, blue+'10'); ridge(ix, gr);
    g.strokeStyle=css('--snow'); g.lineWidth=1.8; g.lineJoin='round'; g.beginPath(); let st=false; ix.forEach((v,i)=>{ if(!isNum(v)) return; st?g.lineTo(xp(i),yp(v)):(g.moveTo(xp(i),yp(v)),st=true); }); g.stroke();
    const cR={1:css('--up'),0:css('--amber'),'-1':css('--down')}; const bw=plotW/Math.max(1,N-1);
    rg.forEach((r,i)=>{ g.fillStyle=cR[r]; g.fillRect(xp(i)-bw/2, B+4, bw+.6, 6); });
    g.fillStyle=css('--faint'); g.textAlign='center'; const step=Math.max(1,Math.ceil(N/Math.max(2,Math.floor(plotW/110))));
    for(let i=0;i<N;i+=step) g.fillText(d[i].slice(0,7), xp(i), H-11);
    if(hover!==undefined){ const x=xp(hover); g.strokeStyle=css('--mut'); g.setLineDash([3,3]); g.beginPath(); g.moveTo(x,T-10); g.lineTo(x,B); g.stroke(); g.setLineDash([]);
      g.fillStyle=css('--snow'); g.beginPath(); g.arc(x,yp(ix[hover]),4,0,7); g.fill();
      tip.innerHTML=`<b>${d[hover]}</b><br>NEPSE <b>${fmt.n(ix[hover])}</b><br><span style="color:${css('--ridge2')}">●</span> 50-day EMA ${fmt.n(fa[hover])}<br><span style="color:${css('--ridge1')}">●</span> 200-day SMA ${fmt.n(sl[hover])}<br>Regime: ${['Bear','Neutral','Bull'][rg[hover]+1]}`;
      tip.style.display='block'; const tw=tip.offsetWidth; tip.style.left=Math.min(W-tw-6,x+14)+'px'; tip.style.top=(T-6)+'px'; } else tip.style.display='none';
  }
  draw();
  const pick=e=>{ const r=cv.getBoundingClientRect(); return Math.max(0,Math.min(d.length-1,Math.round((e.clientX-r.left)/((r.width-62)/Math.max(1,d.length-1))))); };
  cv.addEventListener('mousemove',e=>draw(pick(e))); cv.addEventListener('mouseleave',()=>draw());
  cv.addEventListener('touchmove',e=>draw(pick(e.touches[0])),{passive:true});
  new ResizeObserver(()=>draw()).observe(host);
}
function donut(host, parts){
  const total=parts.reduce((a,p)=>a+p.v,0); let a0=-Math.PI/2; const R=78, r=50, cx=90, cy=90;
  const arcs=parts.map(p=>{ const a1=a0+p.v/total*Math.PI*2, large=a1-a0>Math.PI?1:0;
    const P=(ang,rad)=>[cx+rad*Math.cos(ang), cy+rad*Math.sin(ang)];
    const [x0,y0]=P(a0,R),[x1,y1]=P(a1,R),[x2,y2]=P(a1,r),[x3,y3]=P(a0,r);
    const path=`M${x0},${y0} A${R},${R} 0 ${large} 1 ${x1},${y1} L${x2},${y2} A${r},${r} 0 ${large} 0 ${x3},${y3}Z`; a0=a1; return `<path d="${path}" fill="${p.c}"><title>${esc(p.l)} ${fmt.p(p.v/total,0)}</title></path>`; });
  host.innerHTML=`<div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap"><svg width="180" height="180" viewBox="0 0 180 180">${arcs.join('')}<text x="90" y="86" text-anchor="middle" style="font:600 22px var(--cond);fill:var(--text)">${parts.length}</text><text x="90" y="106" text-anchor="middle" style="font:13px var(--font);fill:var(--mut)">sectors</text></svg>
    <div style="flex:1;min-width:200px">${parts.map(p=>`<div class="factor" style="grid-template-columns:12px 1fr 48px"><i style="width:12px;height:12px;border-radius:3px;background:${p.c}"></i><span>${esc(p.l)}${p.warn?' <span class="down">over limit</span>':''}</span><b>${fmt.p(p.v/total,0)}</b></div>`).join('')}</div></div>`;
}
const PAL = ['#4A88E8','#ED1B24','#34C77B','#F2A93B','#9B7BEA','#2BB3A8','#E4609B','#B08A5A','#7F96B8','#C9C24A','#3FB6E3','#E07A3F','#6C7FE0'];

function squarify(items, x, y, w, h){
  const out=[]; let rest=items.filter(i=>i.v>0); const total=rest.reduce((a,b)=>a+b.v,0); if(!total||w<=0||h<=0) return out;
  rest=rest.map(it=>({...it,a:it.v*w*h/total}));
  const worst=(row,side)=>{ const s=row.reduce((a,b)=>a+b.a,0), mx=Math.max(...row.map(r=>r.a)), mn=Math.min(...row.map(r=>r.a)); return Math.max(side*side*mx/(s*s),(s*s)/(side*side*mn)); };
  while(rest.length){ const side=Math.min(w,h); const row=[rest[0]]; let i=1;
    while(i<rest.length && worst([...row,rest[i]],side)<=worst(row,side)){ row.push(rest[i]); i++; }
    const s=row.reduce((a,b)=>a+b.a,0);
    if(w>=h){ const cw=s/h; let cy=y; row.forEach(r=>{ const rh=r.a/cw; out.push({...r,x,y:cy,w:cw,h:rh}); cy+=rh; }); x+=cw; w-=cw; }
    else { const rh=s/w; let cx=x; row.forEach(r=>{ const rw=r.a/rh; out.push({...r,x:cx,y,w:rw,h:rh}); cx+=rw; }); y+=rh; h-=rh; }
    rest=rest.slice(i); }
  return out;
}
function heatColor(c){ if(!isNum(c)) return '#2A3F66'; const t=Math.max(-1,Math.min(1,c/0.05));
  const mix=(a,b,k)=>a.map((v,i)=>Math.round(v+(b[i]-v)*k)); const mid=[42,63,102], up=[32,163,91], dn=[195,36,43];
  const [r,g,b]= t>=0 ? mix(mid,up,t) : mix(mid,dn,-t); return `rgb(${r},${g},${b})`; }
function drawHeat(){
  const host=$('#heat'); if(!host) return; const W=host.clientWidth, H=host.clientHeight;
  const rows=D.rows.filter(r=>isNum(r.turnover)&&r.turnover>0&&!r.stale);
  const secs={}; rows.forEach(r=>{ (secs[r.sector]=secs[r.sector]||[]).push(r); });
  const secItems=Object.entries(secs).map(([s,rs])=>({s, rs, v:rs.reduce((a,r)=>a+r.turnover,0)})).sort((a,b)=>b.v-a.v);
  let html='';
  squarify(secItems,0,0,W,H).forEach(sb=>{
    html+=`<div class="sec" style="left:${sb.x}px;top:${sb.y}px;width:${sb.w}px;height:${sb.h}px">${sb.w>70&&sb.h>30?`<span>${esc(sb.s)}</span>`:''}</div>`;
    const inner=squarify(sb.rs.map(r=>({r,v:r.turnover})).sort((a,b)=>b.v-a.v), sb.x+1, sb.y+(sb.h>40?18:1), sb.w-2, sb.h-(sb.h>40?19:2));
    inner.forEach(t=>{ const r=t.r, big=t.w>54&&t.h>34;
      html+=`<div class="tile" title="${r.symbol} ${fmt.sp(r.chg_pct,2)}  turnover Rs ${fmt.npr(r.turnover)}" style="left:${t.x}px;top:${t.y}px;width:${t.w}px;height:${t.h}px;background:${heatColor(r.chg_pct)}" onclick="openStock('${r.symbol}')">${big?`<b>${r.symbol}</b><small>${fmt.sp(r.chg_pct)}</small>`:t.w>34&&t.h>16?`<small>${r.symbol}</small>`:''}</div>`; });
  });
  host.innerHTML=html||'<div class="empty">No trades recorded for the last session.</div>';
  if(!host._ro){ host._ro=new ResizeObserver(()=>{ clearTimeout(host._t); host._t=setTimeout(drawHeat,120); }); host._ro.observe(host); }
}

function rowsNow(){

  const {k,d}=S.sort;
  return [...rows].sort((a,b)=>{ const x=a[k], y=b[k]; if(typeof x==='string'||typeof y==='string') return d*String(x||'').localeCompare(String(y||'')); return d*((isNum(x)?x:-1e18)-(isNum(y)?y:-1e18)); });

$('#drawerBg').onclick=closeDrawer;
async function drawDrawer(){
  const r=D.by[CUR]; if(!r) return;
  $('#dHead').innerHTML=`<div class="dtitle"><h2>${r.symbol}</h2>${starBtn(r.symbol)}<span class="mut">${esc(r.name)}<br>${esc(r.sector)}</span>
      <span style="margin-left:auto" class="px num">${fmt.n(r.close)}</span><span class="num ${tone(r.chg_pct)}" style="font-size:19px;font-weight:600">${fmt.sp(r.chg_pct,2)}</span>
      ${call(r.stance_code)}<span class="num" style="font-size:19px" title="Composite score">${fmt.n(r.score,0)}<span class="faint" style="font-size:14px">/100</span></span>
      <button class="iconbtn" onclick="closeDrawer()" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="tabs" id="dTabs">${[['chart','Chart'],['analysis','Why this call'],['fund','Fundamentals'],['tech','Technicals']].map(([k,l])=>`<button data-k="${k}" class="${S.dtab===k?'on':''}">${l}</button>`).join('')}</div>`;
  $('#dTabs').onclick=e=>{ const k=e.target.dataset.k; if(k){ S.dtab=k; drawDrawer(); } };

  if(S.dtab==='chart'){
    b.innerHTML=`<div class="toolbar" style="margin-bottom:8px"><div class="seg" id="tf">${[[63,'3M'],[126,'6M'],[250,'1Y'],[500,'2Y']].map(([n,l])=>`<button data-n="${n}" class="${S.dtf===n?'on':''}">${l}</button>`).join('')}</div>
      ${[['e20','20 EMA'],['e50','50 EMA'],['s200','200 SMA'],['bb','Bollinger'],['st','Supertrend']].map(([k,l])=>`<button class="chip ${S.ind[k]?'':'off'}" data-i="${k}">${l}</button>`).join('')}
      <span class="faint">|</span>${[['vol','Volume'],['rsi','RSI'],['macd','MACD']].map(([k,l])=>`<button class="chip ${S.panes[k]?'':'off'}" data-p="${k}">${l}</button>`).join('')}</div>
      <div id="sc"><div class="empty">Loading chart</div></div>
      <div class="grid cols-2 mt"><div class="panel"><h2>Key levels</h2><div class="kv" style="grid-template-columns:1fr 1fr">
        ${kv('Supertrend',r.st_dir>0?`<span class="up">support ${fmt.n(r.st_line)}</span>`:`<span class="down">resistance ${fmt.n(r.st_line)}</span>`)}${kv('50-day EMA',fmt.n(r.ema_50))}${kv('200-day SMA',fmt.n(r.sma_200))}${kv('ATR (14)',fmt.n(r.atr_14))}
        ${kv('52-week high',fmt.n(r.high_52w_t))}${kv('52-week low',fmt.n(r.low_52w_t))}${kv('From 52W high',`<span class="${tone(r.pct_from_52w_high)}">${fmt.sp(r.pct_from_52w_high)}</span>`)}${kv('Avg turnover','Rs '+fmt.npr(r.turnover_sma_20))}</div></div>
        <div class="panel"><h2>Factor scores</h2>${factorBars(r)}</div></div>
      <div class="toolbar mt"><button class="btn pri" onclick="addToPortfolio('${r.symbol}')">Add to my portfolio</button></div>`;
    $('#tf').onclick=e=>{ const n=+e.target.dataset.n; if(n){ S.dtf=n; drawDrawer(); } };
    $$('[data-i]',b).forEach(c=>c.onclick=()=>{ S.ind[c.dataset.i]=!S.ind[c.dataset.i]; drawDrawer(); });
    $$('[data-p]',b).forEach(c=>c.onclick=()=>{ S.panes[c.dataset.p]=!S.panes[c.dataset.p]; drawDrawer(); });
    const h=await getHistory(r.symbol); if(CUR!==r.symbol || S.dtab!=='chart') return;
    if(!h){ $('#sc').innerHTML='<div class="empty">No price history for this stock.</div>'; return; }
    const s0=Math.max(0,h.d.length-S.dtf), sl=a=>(a||[]).slice(s0);
    const main=[{type:'candle',o:sl(h.o),h:sl(h.h),l:sl(h.l),c:sl(h.c)}];
    if(S.ind.bb) main.unshift({type:'band',hi:sl(h.bbu),lo:sl(h.bbl),c:'--blue-soft',noTip:true});
    if(S.ind.e20) main.push({y:sl(h.e20),c:'--amber',w:1.2,name:'20 EMA'});
    if(S.ind.e50) main.push({y:sl(h.e50),c:'--blue',w:1.3,name:'50 EMA'});
    if(S.ind.s200) main.push({y:sl(h.s200),c:'--down',w:1.4,name:'200 SMA'});
    if(S.ind.st) main.push({type:'dots',y:sl(h.st),colors:sl(h.std).map(x=>x>0?'--up':'--down'),r:1.4,name:'Supertrend',tc:'--up'});
    const panels=[{h:3.4,series:main}];
    if(S.panes.vol) panels.push({h:.75,title:'Volume',zero:true,yfmt:v=>fmt.npr(v),series:[{type:'bar',y:sl(h.v),colors:sl(h.c).map((c,i,a)=>i&&c<a[i-1]?'--down-mid':'--up-mid'),name:'Volume',fmt:v=>fmt.i(v),tc:'--mut'}]});
    if(S.panes.rsi) panels.push({h:.9,title:'RSI 14',fixed:[0,100],hlines:[{v:70,c:'--down-soft'},{v:30,c:'--up-soft'}],series:[{y:sl(h.rsi),c:'#9B7BEA',name:'RSI',fmt:v=>fmt.n(v,0)}]});
    if(S.panes.macd) panels.push({h:.9,title:'MACD',series:[{type:'bar',y:sl(h.hist),name:'Histogram'},{y:sl(h.macd),c:'--blue',w:1.1,name:'MACD'},{y:sl(h.sig),c:'--amber',w:1.1,name:'Signal'}]});
    makeChart($('#sc'),{x:sl(h.d),height:300+panels.length*80,panels});
  } else if(S.dtab==='analysis'){
    b.innerHTML=`<div class="grid cols-2"><div class="panel"><h2>${STANCE[r.stance_code]||'No call'}, score ${fmt.n(r.score,0)}</h2><p class="sub">What the model sees today</p><ul class="why">${(r.reasons||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
      <div class="panel"><h2>Factor scores</h2><p class="sub">0 to 100; 60 and above is strong</p>${factorBars(r)}</div></div>
      ${(r.screens||[]).length?`<div class="panel mt"><h2>Screens this stock passes</h2><div class="rule">${r.screens.map(id=>`<span class="chip" onclick="closeDrawer();S.screen='${id}';go('screener')">${esc(D.preset[id]?.name||id)}</span>`).join('')}</div></div>`:''}`;
  } else if(S.dtab==='fund'){
    b.innerHTML=`<div class="panel"><h2>Fundamentals</h2><p class="sub">${r.eps_period?'Latest report '+esc(r.eps_period)+'. ':''}${r.fund_source?'Source: '+esc(r.fund_source)+'. ':''}P/E and P/B use today's price.</p><div class="kv">
      ${kv('EPS',fmt.n(r.eps))}${kv('P/E',fmt.n(r.pe,1))}${kv('Sector median P/E',fmt.n(r.sector_pe_median,1))}${kv('P/E vs sector',fmt.n(r.pe_vs_sector,2)+'×')}
      ${kv('Book value / share',fmt.n(r.bvps))}${kv('P/B',fmt.n(r.pbv,2))}${kv('Sector median P/B',fmt.n(r.sector_pbv_median,2))}${kv('ROE',fmt.p(r.roe))}
      ${kv('Dividend yield',fmt.p(r.div_yield))}${kv('Earnings yield',fmt.p(r.earnings_yield))}${kv('Graham number',fmt.n(r.graham,0))}${kv('Graham margin',`<span class="${tone(r.graham_discount)}">${fmt.sp(r.graham_discount)}</span>`)}
      ${kv('Market cap','Rs '+fmt.npr(r.mcap))}${kv('Bonus declared',isNum(r.bonus_pct)?fmt.n(r.bonus_pct,1)+'%':'–')}${isNum(r.npl)?kv('NPL',fmt.p(r.npl)):''}${isNum(r.car)?kv('CAR',fmt.p(r.car)):''}</div></div>`;
  } else {
    b.innerHTML=`<div class="panel"><h2>Technical readings</h2><div class="kv">
      ${kv('RSI 14',fmt.n(r.rsi_14,0))}${kv('RSI 2',fmt.n(r.rsi_2,0))}${kv('MACD',fmt.n(r.macd,2))}${kv('MACD signal',fmt.n(r.macd_signal,2))}${kv('MACD histogram',fmt.n(r.macd_hist,2))}
      ${kv('ADX',fmt.n(r.adx_14,0))}${kv('+DI / −DI',fmt.n(r.plus_di,0)+' / '+fmt.n(r.minus_di,0))}${kv('Bollinger %B',fmt.n(r.bb_pctb,2))}${kv('Stochastic %K',fmt.n(r.stoch_k,0))}${kv('Money flow',fmt.n(r.mfi_14,0))}
      ${kv('Volume vs avg',fmt.n(r.vol_ratio,1)+'×')}${kv('ATR %',fmt.p(r.atr_pct))}${kv('Volatility (yr)',fmt.p(r.volatility_20,0))}${kv('vs 200-day',`<span class="${tone(r.dist_sma200)}">${fmt.sp(r.dist_sma200)}</span>`)}${kv('vs 50-day',`<span class="${tone(r.dist_ema50)}">${fmt.sp(r.dist_ema50)}</span>`)}
      ${kv('1 week',`<span class="${tone(r.ret_1w)}">${fmt.sp(r.ret_1w)}</span>`)}${kv('1 month',`<span class="${tone(r.ret_1m)}">${fmt.sp(r.ret_1m)}</span>`)}${kv('3 months',`<span class="${tone(r.ret_3m)}">${fmt.sp(r.ret_3m)}</span>`)}${kv('6 months',`<span class="${tone(r.ret_6m)}">${fmt.sp(r.ret_6m)}</span>`)}${kv('12 months',`<span class="${tone(r.ret_12m)}">${fmt.sp(r.ret_12m)}</span>`)}
      ${kv('RS rating',fmt.n(r.rs_rating,0))}${kv('Sector RS rank',fmt.n(r.sector_rs_rank,0))}${kv('Liquid',r.liquid?'Yes':'No')}${kv('Last traded',esc(r.last_traded||'–'))}</div></div>`;
  }
}
function factorBars(r){ return [['Trend','score_trend'],['Momentum','score_momentum'],['Volume','score_volume'],['Timing','score_timing'],['Sector','score_sector'],['Value','score_value'],['Quality','score_quality'],['Liquidity','score_liquidity']]
  .map(([l,k])=>{ const v=r[k]; return `<div class="factor"><span>${l}</span><div class="bar"><i style="width:${isNum(v)?v:0}%;background:${(v||0)>=60?'var(--up)':(v||0)<40?'var(--down)':'var(--blue)'}"></i></div><b>${fmt.n(v,0)}</b></div>`; }).join(''); }

R.sectors = function(){
  const el=$('#pg-sectors'), SX=D.sectors||[];
  const q={Leading:'var(--up)',Weakening:'var(--amber)',Lagging:'var(--down)',Improving:'var(--blue)'};
  el.innerHTML=`<div class="pagehead"><h1>Sectors</h1><p>Money rotates between sectors. Ranked by relative strength over the last one to three months.</p></div>
  <div class="tbl" style="max-height:none"><table><thead><tr><th>Sector</th><th class="num">1W</th><th class="num">1M</th><th class="num">3M</th><th class="num">6M</th><th class="num">12M</th><th class="num">RS rank</th><th>Rotation</th><th class="num">Above 200-day</th><th class="num">P/E</th><th class="num">P/B</th><th class="num">ROE</th><th class="num">Div yield</th><th class="num">Avg score</th><th class="num">Buy / sell calls</th><th>Leaders</th></tr></thead><tbody>
    ${SX.map(s=>`<tr class="row" onclick="S.sector='${esc(s.sector)}';S.screen='';go('screener')"><td><span class="sym">${esc(s.sector)}</span><span class="nm">${s.n} stocks</span></td>
      ${['ret_1w','ret_1m','ret_3m','ret_6m','ret_12m'].map(k=>`<td class="num ${tone(s[k])}">${fmt.sp(s[k])}</td>`).join('')}
      <td class="num"><b>${fmt.n(s.rs_rank,0)}</b></td><td><span class="reg"><i style="background:${q[s.quadrant]||'var(--faint)'}"></i>${s.quadrant}</span></td><td class="num">${fmt.p(s.above_200,0)}</td>
      <td class="num">${fmt.n(s.median_pe,1)}</td><td class="num">${fmt.n(s.median_pbv,2)}</td><td class="num">${fmt.p(s.median_roe)}</td><td class="num">${fmt.p(s.median_div_yield)}</td><td class="num">${fmt.n(s.avg_score,0)}</td>
      <td class="num"><span class="up">${s.buys}</span> / <span class="down">${s.exits}</span></td><td>${s.leaders.slice(0,3).map(x=>`<a href="#" onclick="event.stopPropagation();openStock('${x}');return false">${x}</a>`).join(', ')}</td></tr>`).join('')}</tbody></table></div>
  <div class="grid cols-2 mt"><div class="panel"><h2>Rotation map</h2><p class="sub">Sectors usually move clockwise: improving, leading, weakening, lagging. Tails show the last 12 weeks.</p><div id="rrg"></div></div>
    <div class="panel"><h2>Sector indices</h2><p class="sub">Equal-weight, rebased to 100 one year ago. Click a name to show or hide it.</p><div class="rule" id="secPick"></div><div id="secLines" class="mt"></div></div></div>`;
  rrg($('#rrg'), SX);
  const on=new Set(store('nepse_sec_on')||SX.slice(0,4).map(s=>s.sector));
  const drawL=()=>{ $('#secPick').innerHTML=SX.map((s,i)=>`<button class="chip ${on.has(s.sector)?'':'off'}" data-s="${esc(s.sector)}" style="${on.has(s.sector)?`background:${PAL[i%PAL.length]}22;color:${PAL[i%PAL.length]}`:''}">${esc(s.sector)}</button>`).join('');
    $$('#secPick .chip').forEach(c=>c.onclick=()=>{ const v=c.dataset.s; on.has(v)?on.delete(v):on.add(v); store('nepse_sec_on',[...on]); drawL(); });
    makeChart($('#secLines'),{x:SX[0]?.series.d||[],height:340,panels:[{hlines:[{v:100}],series:SX.map((s,i)=>({s,i})).filter(o=>on.has(o.s.sector)).map(({s,i})=>({y:s.series.v,c:PAL[i%PAL.length],name:s.sector,w:1.6}))}]}); };
  drawL();
};
function rrg(host, SX){
  host.innerHTML=''; host.classList.add('chart'); const cv=document.createElement('canvas'); host.append(cv); const H=400;
  const draw=()=>{ const W=host.clientWidth||500, dpr=devicePixelRatio||1; cv.width=W*dpr; cv.height=H*dpr; cv.style.height=H+'px'; const g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.font='12px Barlow, system-ui';
    const pts=SX.flatMap(s=>[{x:s.rs_ratio,y:s.rs_mom},...(s.tail||[])]).filter(p=>isNum(p.x)&&isNum(p.y));
    let x0=Math.min(97,...pts.map(p=>p.x)),x1=Math.max(103,...pts.map(p=>p.x)),y0=Math.min(97,...pts.map(p=>p.y)),y1=Math.max(103,...pts.map(p=>p.y)); const px=(x1-x0)*.08,py=(y1-y0)*.08; x0-=px;x1+=px;y0-=py;y1+=py;
    const L=10,R=10,T=10,B=24, X=v=>L+(v-x0)/(x1-x0)*(W-L-R), Y=v=>H-B-(v-y0)/(y1-y0)*(H-T-B);
    [[100,x1,100,y1,'--up-soft','Leading'],[100,x1,y0,100,'--amber-soft','Weakening'],[x0,100,y0,100,'--down-soft','Lagging'],[x0,100,100,y1,'--blue-soft','Improving']].forEach(([a,b,c,d,col,lab])=>{ g.fillStyle=css(col); g.fillRect(X(a),Y(d),X(b)-X(a),Y(c)-Y(d)); g.fillStyle=css('--faint'); g.textAlign=a===100?'right':'left'; g.fillText(lab, a===100?X(b)-8:X(a)+8, c===100?Y(d)+14:Y(c)-10); });
    g.fillStyle=css('--faint'); g.textAlign='center'; g.fillText('Relative strength vs market', W/2, H-6);
    SX.forEach((s,i)=>{ const c=PAL[i%PAL.length], t=(s.tail||[]).filter(p=>isNum(p.x)&&isNum(p.y));
      if(t.length>1){ g.strokeStyle=c; g.globalAlpha=.55; g.lineWidth=1.5; g.beginPath(); t.forEach((p,k)=>k?g.lineTo(X(p.x),Y(p.y)):g.moveTo(X(p.x),Y(p.y))); g.stroke(); g.globalAlpha=1; }
      if(!isNum(s.rs_ratio)||!isNum(s.rs_mom)) return; g.fillStyle=c; g.beginPath(); g.arc(X(s.rs_ratio),Y(s.rs_mom),5.5,0,7); g.fill();
      g.fillStyle=css('--text'); g.textAlign='left'; g.fillText(s.sector.replace(' And Processing','').replace(' And ',' & '), X(s.rs_ratio)+8, Y(s.rs_mom)-7); }); };
  draw(); new ResizeObserver(draw).observe(host);
}

R.strategies = function(){
  const el=$('#pg-strategies'), SX=D.strategies||[];
  if(!SX.length){ el.innerHTML='<div class="panel empty"><b>No backtests yet</b>They are created by the daily update.</div>'; return; }
  if(!S.strat) S.strat=[...SX].sort((a,b)=>(b.metrics.calmar||0)-(a.metrics.calmar||0))[0].id;
  const b=SX[0].benchmark_metrics||{};
  const vc={robust:'c1',fragile:'c-1','over-fitted':'c-2','no edge':'c-2'};
  el.innerHTML=`<div class="pagehead"><h1>Strategies</h1><p>Backtested ${esc(SX[0].metrics.start)} to ${esc(SX[0].metrics.end)} after NEPSE commission, SEBON fee, DP charge, capital gains tax, T+2 settlement and circuit limits.</p></div>
  <div class="tbl" style="max-height:none"><table><thead><tr><th>Strategy</th><th>Equity curve</th><th class="num">CAGR</th><th class="num">vs NEPSE</th><th class="num">Max drawdown</th><th class="num">Sharpe</th><th class="num">Win rate</th><th class="num">Trades</th><th>Out-of-sample</th><th>Today</th></tr></thead><tbody>
    ${[...SX].sort((x,y)=>(y.metrics.calmar||0)-(x.metrics.calmar||0)).map(s=>{ const m=s.metrics, o=s.optimization, t=(s.current.entries||s.current.picks||[]);
      return `<tr class="row" onclick="S.strat='${s.id}';S.stab='overview';R.strategies()" style="${s.id===S.strat?'box-shadow:inset 3px 0 0 var(--brandred);background:var(--blue-soft)':''}"><td><span class="sym">${esc(s.name)}</span><span class="nm">${s.type==='signal'?'Entry and exit rules':'Periodic rotation'}</span></td>
      <td>${spark(s.curve.equity.filter((_,i,a)=>i%Math.ceil(a.length/60)===0),110,28)}</td><td class="num ${tone(m.cagr)}"><b>${fmt.sp(m.cagr)}</b></td><td class="num ${tone(m.excess_cagr)}">${fmt.sp(m.excess_cagr)}</td>
      <td class="num down">${fmt.p(m.max_drawdown)}</td><td class="num">${fmt.n(m.sharpe)}</td><td class="num">${fmt.p(m.win_rate,0)}</td><td class="num">${fmt.i(m.trades)}</td>
      <td>${o?`<span class="call ${vc[o.verdict]||'c0'}">${o.verdict}</span>`:'<span class="faint">not tested</span>'}</td><td style="font-size:13px">${t.length?t.slice(0,3).join(', ')+(t.length>3?` +${t.length-3}`:''):'<span class="faint">none</span>'}</td></tr>`; }).join('')}
    <tr><td><span class="sym">Buy and hold NEPSE</span><span class="nm">Benchmark</span></td><td></td><td class="num">${fmt.sp(b.cagr)}</td><td></td><td class="num down">${fmt.p(b.max_drawdown)}</td><td class="num">${fmt.n(b.sharpe)}</td><td colspan="4"></td></tr></tbody></table></div>
  <div id="sd" class="mt"></div>`;
  drawStrat(SX.find(s=>s.id===S.strat)||SX[0]);
};
function drawStrat(s){
  const m=s.metrics, o=s.optimization, cur=s.current||{}, kv=(l,v)=>`<div><span>${l}</span><b>${v}</b></div>`;
  const lk=x=>`<a href="#" onclick="openStock('${x}');return false">${x}</a>`;
  $('#sd').innerHTML=`<div class="panel"><div class="panel-head"><div><h2>${esc(s.name)}</h2><p class="sub" style="max-width:90ch">${esc(s.description)}</p></div>
    <div class="seg" id="stTabs">${[['overview','Performance'],['trades','Trades'],['rules','Rules and tuning'],['signals','Today']].map(([k,l])=>`<button data-k="${k}" class="${S.stab===k?'on':''}">${l}</button>`).join('')}</div></div>
    ${(s.warnings||[]).map(w=>`<div class="notice">${esc(w)}</div>`).join('')}<div id="stBody"></div></div>`;
  $('#stTabs').onclick=e=>{ const k=e.target.dataset.k; if(k){ S.stab=k; drawStrat(s); } };
  const B=$('#stBody');
  if(S.stab==='overview'){

function parseCSV(text){
  const lines=text.trim().split(/\r?\n/).filter(Boolean); if(!lines.length) return [];
  const split=l=>l.match(/("([^"]|"")*"|[^,]*)(,|$)/g).slice(0,-1).map(x=>x.replace(/,$/,'').replace(/^"|"$/g,'').replace(/""/g,'"').trim());
  const head=split(lines[0]).map(h=>h.toLowerCase().replace(/[^a-z_ ]/g,'').trim().replace(/ +/g,'_'));
  const find=(...ns)=>head.findIndex(h=>ns.some(n=>h===n||h.includes(n)));
  const iS=find('symbol','scrip','script'), iQ=find('quantity','qty','current_balance','balance'), iW=find('wacc','rate','avg','cost'), iD=find('buy_date','purchase','date');
  if(iS<0||iQ<0) throw new Error('The CSV needs “symbol” and “quantity” columns');
  const num=x=>parseFloat(String(x||'').replace(/,/g,''));
  return lines.slice(1).map(l=>{ const c=split(l); return {symbol:(c[iS]||'').toUpperCase(),quantity:num(c[iQ]),wacc:iW>=0?num(c[iW]):NaN,buy_date:iD>=0?(c[iD]||'').slice(0,10):''}; }).filter(h=>h.symbol&&h.quantity>0);
}
const COST=()=>(D.meta.settings||{}).costs||{}, PFC=()=>(D.meta.settings||{}).portfolio||{};
function commission(v){ const c=COST(); for(const [lim,rate] of (c.broker_commission_tiers||[[null,.004]])) if(lim===null||v<=lim) return Math.max(c.min_commission||10,v*rate); return v*.0024; }
function sellBreakdown(qty,px,basis,days){ const c=COST(), v=qty*px, fees=commission(v)+v*(c.sebon_fee||.00015)+(c.dp_charge||25), gain=v-fees-basis;
  const rate=days>(c.long_term_days||365)?(c.cgt_long_term??.0375):(c.cgt_short_term??.05), tax=Math.max(0,gain)*rate; return {net:v-fees-tax,profit:gain-tax,gain,rate,tax}; }

async function analyzePF(holdings){
  const P=PFC(), k=P.atr_stop_multiple??3, hard=P.hard_stop_pct??.15, maxW=P.max_position_weight??.2, maxSW=P.max_sector_weight??.4, redF=P.reduce_fraction??.5, taxWin=P.tax_wait_window_days??30;
  const c=COST(), lt=c.long_term_days||365, reg=D.market.regime, today=new Date(D.meta.last_trade_date);
  const pos=[], unknown=[]; let total=0;
  for(const h of holdings){ const r=D.by[h.symbol]; if(!r){ unknown.push(h.symbol); continue; } const value=h.quantity*r.close; total+=value; pos.push({h,r,value}); }
  const secVal={}; pos.forEach(p=>secVal[p.r.sector]=(secVal[p.r.sector]||0)+p.value);
  const out=[];
  for(const {h,r,value} of pos){
    const wacc=isNum(h.wacc)&&h.wacc>0?h.wacc:r.close, cost=h.quantity*wacc, weight=total?value/total:0, sw=total?secVal[r.sector]/total:0, code=isNum(r.stance_code)?r.stance_code:0;
    const hist=await getHistory(h.symbol); let peak=r.close, recent=r.close;
    if(hist){ const n=hist.d.length, bd=h.buy_date?new Date(h.buy_date):null; let st=bd?hist.d.findIndex(d=>new Date(d)>=bd):n-60; if(st<0) st=n-1; st=Math.max(st,n-120,0);
      peak=Math.max(...hist.c.slice(st).filter(isNum),r.close); recent=Math.max(...hist.c.slice(Math.max(0,n-20)).filter(isNum),r.close); }
    let stop=isNum(r.atr_14)?peak-k*r.atr_14:null, basis=`${k}× ATR below the high of ${fmt.n(peak,1)}`, reset=false;
    if(stop!==null&&r.close<stop&&code>=1){ stop=recent-k*r.atr_14; basis=`${k}× ATR below the 20-day high of ${fmt.n(recent,1)}`; reset=true; }
    if(r.st_dir>0&&isNum(r.st_line)&&(stop===null||r.st_line>stop)){ stop=r.st_line; basis='Supertrend support'; }
    const days=h.buy_date?Math.round((today-new Date(h.buy_date))/864e5):null, br=sellBreakdown(h.quantity,r.close,cost,days??0), toLT=days!==null&&days<=lt?lt+1-days:0;
    let action='HOLD', detail='The trend and score don’t call for a change.', sellQty=0;
    if(stop!==null&&r.close<stop){ action='EXIT'; detail=`Closed below the trailing stop of ${fmt.n(stop,1)} (${basis}).`; sellQty=h.quantity; }
    else if(code===-2){ action='EXIT'; detail='The model rates it Exit: broken trend and a weak score.'; sellQty=h.quantity; }
    else if(r.close<wacc*(1-hard)&&code<=0){ action='EXIT'; detail=`Down more than ${fmt.p(hard,0)} from your cost with no supporting trend. Cut the loss.`; sellQty=h.quantity; }
    else if(code===-1){ action='REDUCE'; sellQty=Math.floor(h.quantity*redF); detail=(r.rsi_14>((D.meta.settings.scoring||{}).overbought_rsi||80)&&r.close>wacc)?'Overextended rally. Book part of the profit.':'Trend is weakening. Reduce and keep the rest under the stop.'; }
    else if(weight>maxW){ action='REDUCE'; sellQty=Math.floor(h.quantity*(1-maxW/weight)); detail=`This is ${fmt.p(weight,0)} of your portfolio, above the ${fmt.p(maxW,0)} limit. Trim to control risk.`; }
    else if(code>=1&&reg>=0&&weight<maxW*.8&&sw<maxSW){ action='ADD'; detail=`Rated ${code===2?'strong buy':'buy'} in an uptrend. Adding on dips is reasonable.`; }
    const notes=[];
    if(action!=='EXIT'&&br.gain>0&&toLT>0&&toLT<=taxWin) notes.push(`Hold ${toLT} more days to pay ${fmt.p(c.cgt_long_term,2)} tax instead of ${fmt.p(c.cgt_short_term,0)}, saving about Rs ${fmt.i(br.gain*((c.cgt_short_term||.05)-(c.cgt_long_term||.0375)))}.`);
    if(sw>maxSW) notes.push(`${r.sector} is ${fmt.p(sw,0)} of the portfolio (limit ${fmt.p(maxSW,0)}).`);
    if(!r.liquid) notes.push('Thinly traded, so selling may take several sessions.');
    if(reg<0&&action==='HOLD') notes.push('Bear market: tighten the stop and avoid averaging down.');
    if(reset) notes.push('An older stop was broken earlier but the trend has recovered, so the stop now follows the recent swing.');
    if(!h.buy_date) notes.push('Add a buy date for the exact tax rate and stop.');
    out.push({...h,r,wacc,cost,value,pnl:value-cost,pnlPct:cost?value/cost-1:null,weight,action,detail,sellQty,stop,basis,days,toLT,br,notes});
  }
  const ord={EXIT:0,REDUCE:1,ADD:2,HOLD:3}; out.sort((a,b)=>ord[a.action]-ord[b.action]||b.value-a.value);
  return {out,total,secVal,unknown};
}

  <div class="toolbar"><div class="seg" id="tSrc"><button data-v="live" class="${S.trackSrc==='live'?'on':''}">Live calls</button><button data-v="simulated" class="${S.trackSrc==='simulated'?'on':''}">Simulated history</button></div>
    <div class="seg" id="tH">${hz.map(h=>`<button data-v="${h}" class="${h===H?'on':''}">After ${h} sessions</button>`).join('')}</div>
    <span class="mut" style="font-size:13.5px;margin-left:auto">${S.trackSrc==='live'?`Logging since ${esc(src.first_date||'today')}: ${src.days_logged||0} days, ${fmt.i(src.calls)} calls`:`Rebuilt from prices ${esc(src.first_date||'')} to ${esc(src.last_date||'')}, ${fmt.i(src.calls)} calls`}</span></div>
  ${S.trackSrc==='live'&&!rows.some(r=>r['n_'+H]>0)?`<div class="notice mt">Live calls are scored once ${H} sessions have passed. Until then, the simulated history shows how the same rules would have done.</div>`:''}
  <div class="strip mt"><div><div class="k">Buy calls that beat NEPSE</div><div class="v">${fmt.p(wavg(buy,'hit_'+H),0)}</div><div class="s">average excess ${fmt.sp(wavg(buy,'avg_excess_'+H))}</div></div>
    <div><div class="k">Sell calls that lagged NEPSE</div><div class="v">${fmt.p(wavg(sell,'hit_'+H),0)}</div><div class="s">average excess ${fmt.sp(wavg(sell,'avg_excess_'+H))}</div></div>
    <div><div class="k">Score predictive power (IC)</div><div class="v">${fmt.n(ic.mean_ic,3)}</div><div class="s">${isNum(ic.mean_ic)?(ic.mean_ic>.03?'Useful: above 0.03':'Weak: below 0.03'):'Not enough data'}</div></div>
    <div><div class="k">Top vs bottom fifth by score</div><div class="v"><span class="${tone(ic.top_quintile_ret)}">${fmt.sp(ic.top_quintile_ret)}</span> <span class="faint">/</span> <span class="${tone(ic.bottom_quintile_ret)}">${fmt.sp(ic.bottom_quintile_ret)}</span></div><div class="s">average return after ${ic.horizon||T.main_horizon} sessions</div></div></div>
  <div class="grid split mt"><div class="panel"><h2>Results by call</h2><p class="sub">A buy call is a hit if the stock beat the NEPSE index; a reduce or exit call is a hit if it lagged.</p>
    <table class="plain"><thead><tr><th>Call</th><th class="num">Calls</th><th class="num">Scored</th><th class="num">Hit vs NEPSE</th><th class="num">Hit, absolute</th><th class="num">Avg return</th><th class="num">Avg vs NEPSE</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${call(STANCE_CODE[r.label])}</td><td class="num">${fmt.i(r.calls)}</td><td class="num">${fmt.i(r['n_'+H])}</td><td class="num"><b>${fmt.p(r['hit_'+H],0)}</b></td><td class="num">${fmt.p(r['abs_hit_'+H],0)}</td><td class="num ${tone(r['avg_ret_'+H])}">${fmt.sp(r['avg_ret_'+H])}</td><td class="num ${tone(r['avg_excess_'+H])}">${fmt.sp(r['avg_excess_'+H])}</td></tr>`).join('')}</tbody></table></div>
    <div class="panel"><h2>The staircase</h2><p class="sub">Average return vs NEPSE by call. A working model steps down from strong buy to exit.</p><div id="stair"></div></div></div>
  <div class="grid cols-2 mt"><div class="panel"><h2>Monthly hit rate of buy calls</h2><p class="sub">${T.main_horizon}-session horizon; the dashed line is a coin flip</p><div id="monthly"></div></div>
    <div class="panel"><h2>Where the model works best</h2><p class="sub">Buy calls, ${T.main_horizon} sessions</p>
      <table class="plain"><thead><tr><th>Sector</th><th class="num">Calls</th><th class="num">Hit</th><th class="num">Avg vs NEPSE</th></tr></thead><tbody>${(src.by_sector||[]).map(r=>`<tr><td>${esc(r.sector)}</td><td class="num">${r.calls}</td><td class="num">${fmt.p(r.hit,0)}</td><td class="num ${tone(r.avg_excess)}">${fmt.sp(r.avg_excess)}</td></tr>`).join('')}</tbody></table>
      <table class="plain mt"><thead><tr><th>Market regime</th><th class="num">Calls</th><th class="num">Hit</th><th class="num">Avg vs NEPSE</th></tr></thead><tbody>${(src.by_regime||[]).map(r=>`<tr><td>${regime(+r.regime)}</td><td class="num">${r.calls}</td><td class="num">${fmt.p(r.hit,0)}</td><td class="num ${tone(r.avg_excess)}">${fmt.sp(r.avg_excess)}</td></tr>`).join('')}</tbody></table></div></div>
  <div class="panel mt"><h2>Strategy signals, live</h2><p class="sub">How each strategy’s real-time entries and picks have done since logging began</p>
    ${Object.keys(T.strategies_live||{}).length?`<div class="tbl" style="max-height:none"><table><thead><tr><th>Strategy</th><th>Signal</th><th class="num">Count</th>${hz.map(h=>`<th class="num">Hit ${h}d</th><th class="num">Vs NEPSE ${h}d</th>`).join('')}</tr></thead><tbody>
      ${Object.entries(T.strategies_live).flatMap(([sid,v])=>v.by_signal.filter(r=>r.direction!==0).map(r=>`<tr><td>${esc((D.strategies||[]).find(s=>s.id===sid)?.name||sid)}</td><td>${r.label.toLowerCase()}</td><td class="num">${r.calls}</td>${hz.map(h=>`<td class="num">${fmt.p(r['hit_'+h],0)}</td><td class="num ${tone(r['avg_excess_'+h])}">${fmt.sp(r['avg_excess_'+h])}</td>`).join('')}</tr>`)).join('')}</tbody></table></div>`
      :'<div class="empty">Signals are logged each day and scored once enough sessions pass.</div>'}</div>
  <div class="panel mt"><div class="panel-head"><div><h2>Recent calls and outcomes</h2><p class="sub">Stored permanently in data/tracking/recommendations.csv</p></div>
    <label style="display:flex;gap:6px;align-items:center;font-size:14px"><input type="checkbox" id="tMine" ${S.trackMine?'checked':''}> Only stocks I hold</label></div>
    <div class="tbl" style="max-height:480px"><table><thead><tr><th>Date</th><th>Stock</th><th>Call</th><th class="num">Score</th><th class="num">Price</th>${hz.map(h=>`<th class="num">${h}-day return</th><th class="num">vs NEPSE</th>`).join('')}</tr></thead><tbody>
    ${list.slice(0,300).map(r=>`<tr class="row" onclick="openStock('${r.symbol}')"><td>${r.date}</td><td class="sym">${r.symbol}</td><td>${call(STANCE_CODE[r.stance])}</td><td class="num">${fmt.n(r.score,0)}</td><td class="num">${fmt.n(r.close)}</td>${hz.map(h=>`<td class="num ${tone(r['ret_'+h])}">${isNum(r['ret_'+h])?fmt.sp(r['ret_'+h]):'<span class="faint">waiting</span>'}</td><td class="num ${tone(r['excess_'+h])}">${fmt.sp(r['excess_'+h])}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="11"><div class="empty">No live calls logged yet.</div></td></tr>`}</tbody></table></div></div>`;
  $('#tSrc').onclick=e=>{ if(e.target.dataset.v){ S.trackSrc=e.target.dataset.v; R.track(); } };
  $('#tH').onclick=e=>{ if(e.target.dataset.v){ S.trackH=+e.target.dataset.v; R.track(); } };
  $('#tMine').onchange=e=>{ S.trackMine=e.target.checked; R.track(); };
  const ex=rows.map(r=>r['avg_excess_'+H]);
  makeChart($('#stair'),{cat:true,x:rows.map(r=>STANCE[STANCE_CODE[r.label]]),xlen:12,height:250,right:56,panels:[{zero:false,yfmt:v=>(v*100).toFixed(1)+'%',hlines:[{v:0}],series:[{type:'bar',y:ex,colors:rows.map(r=>({2:'--up',1:'--up-mid',0:'--faint','-1':'--amber','-2':'--down'})[STANCE_CODE[r.label]]),name:'Avg vs NEPSE',fmt:v=>fmt.sp(v,2),tc:'--blue'}]}]});
  const mo=src.monthly||[];
  if(mo.length) makeChart($('#monthly'),{cat:true,x:mo.map(m=>m.month),xlen:7,height:250,right:46,panels:[{fixed:[0,1],yfmt:v=>(v*100).toFixed(0)+'%',hlines:[{v:.5}],series:[{type:'bar',y:mo.map(m=>m.hit),colors:mo.map(m=>m.hit>=.5?'--up':'--down'),name:'Hit rate',fmt:v=>fmt.p(v,0),tc:'--blue'}]}]});
  else $('#monthly').innerHTML='<div class="empty">Not enough scored calls yet.</div>';
};

/* ======================================================================
   Help
   ====================================================================== */
R.help = function(){
  const el=$('#pg-help'), src=D.meta.sources||{}, c=COST(), th=(D.meta.settings.scoring||{}).stance_thresholds||{};
  el.innerHTML=`<div class="pagehead"><h1>How it works</h1></div>
  <div class="grid cols-2"><div class="panel"><h2>How a call is made</h2><div style="font-size:14.5px;max-width:72ch">
    <p>Each stock gets eight scores from 0 to 100: trend, momentum, volume, timing, sector strength, value and quality against sector peers, and liquidity. They are blended into one composite score.</p>
    <p><b>Strong buy</b> needs a score of ${th.strong_buy} or more, an uptrend and no overbought reading. <b>Buy</b> needs ${th.buy} or more and a price above the 200-day average. <b>Reduce</b> comes below ${th.reduce}, when the trend weakens, or after an overextended rally. <b>Exit</b> comes below ${th.exit} or when the trend breaks.</p>
    <p>When the NEPSE index is in a bear regime, no buy calls are issued, because Nepali stocks tend to fall together.</p>
    <p>Portfolio advice also uses your position: a trailing stop from the highest close since you bought, a ${fmt.p(PFC().hard_stop_pct,0)} loss limit, position and sector size limits, and the capital gains tax date.</p></div></div>
    <div class="panel"><h2>Costs and tax used</h2><table class="plain"><tbody>
      ${(c.broker_commission_tiers||[]).map(([l,r],i,a)=>`<tr><td>Commission, ${i?'Rs '+fmt.i(a[i-1][0])+' to ':'up to '}${l?'Rs '+fmt.i(l):'and above'}</td><td class="num">${fmt.p(r,2)}</td></tr>`).join('')}
      <tr><td>SEBON fee</td><td class="num">${fmt.p(c.sebon_fee,3)}</td></tr><tr><td>DP charge per sale</td><td class="num">Rs ${c.dp_charge}</td></tr>
      <tr><td>Capital gains tax, held ${c.long_term_days} days or less</td><td class="num">${fmt.p(c.cgt_short_term,2)}</td></tr><tr><td>Capital gains tax, held longer</td><td class="num">${fmt.p(c.cgt_long_term,2)}</td></tr></tbody></table>
      <p class="mut" style="font-size:13.5px">Change these in <code>config/settings.yaml</code> if SEBON or the budget revises them.</p></div>
    <div class="panel"><h2>Data sources</h2><p class="sub">Latest checks. Fundamentals: ${esc(D.meta.fundamentals_mode.replace('_',' '))} for ${D.meta.fundamentals_count} companies; index: ${esc(D.meta.index_source)}.</p>
      <table class="plain"><tbody>${Object.entries(src).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.ok?'<span class="call c1">working</span>':'<span class="call c-2">failing</span>'}</td><td style="white-space:normal;font-size:13px" class="mut">${esc(v.detail)}</td></tr>`).join('')||'<tr><td class="mut">No checks recorded yet.</td></tr>'}</tbody></table></div>
    <div class="panel"><h2>Keyboard shortcuts</h2><table class="plain"><tbody><tr><td><kbd>Ctrl</kbd> <kbd>K</kbd> or <kbd>/</kbd></td><td>Search stocks, screens and pages</td></tr><tr><td><kbd>1</kbd> to <kbd>8</kbd></td><td>Switch pages</td></tr><tr><td><kbd>Esc</kbd></td><td>Close the stock panel or search</td></tr></tbody></table>
      <h2 class="mt">Field names for rules</h2><table class="plain"><tbody>${Object.entries(D.fields||{}).map(([k,v])=>`<tr><td><code>${esc(k)}</code></td><td style="white-space:normal;font-size:13.5px">${esc(v)}</td></tr>`).join('')}</tbody></table></div></div>
  <p class="mut mt" style="font-size:13px">For personal research only, not investment advice. Prices are adjusted for bonus and right shares. Data from NEPSE, Merolagani and ShareSansar.</p>`;
};

/* ======================================================================
   Command palette & shortcuts
   ====================================================================== */
let palSel=0, palItems=[];
function openPal(){ $('#pal').classList.add('open'); $('#palIn').value=''; palSel=0; palRender(); $('#palIn').focus(); }
function closePal(){ $('#pal').classList.remove('open'); }
function palRender(){
  const q=$('#palIn').value.trim().toUpperCase(); palItems=[];
  const stocks=!D.rows?[]:(q?D.rows.filter(r=>r.symbol.startsWith(q)||r.symbol.includes(q)||(r.name||'').toUpperCase().includes(q)).sort((a,b)=>(b.symbol.startsWith(q)-a.symbol.startsWith(q))||(b.score||0)-(a.score||0)):[...D.rows].sort((a,b)=>(b.score||0)-(a.score||0))).slice(0,8);
  stocks.forEach(r=>palItems.push({g:'Stocks',h:`<b>${r.symbol}</b> <span class="mut">${esc(r.name||r.sector)}</span>`,r:`${fmt.n(r.close)} <span class="${tone(r.chg_pct)}">${fmt.sp(r.chg_pct)}</span>`,run:()=>openStock(r.symbol)}));
  PAGES.filter(([id,l])=>!q||l.toUpperCase().includes(q)).forEach(([id,l])=>palItems.push({g:'Pages',h:l,r:'',run:()=>go(id)}));
  (D.presets||[]).filter(p=>q&&p.name.toUpperCase().includes(q)).slice(0,6).forEach(p=>palItems.push({g:'Screens',h:esc(p.name),r:`${p.hits.length} stocks`,run:()=>{ S.screen=p.id; go('screener'); }}));
  if(!q||'THEME'.includes(q)||'DARK'.includes(q)||'LIGHT'.includes(q)) palItems.push({g:'Actions',h:'Switch light / dark theme',r:'',run:()=>$('#themeBtn').click()});
  palSel=Math.min(palSel,Math.max(0,palItems.length-1)); let g='';
  $('#palRes').innerHTML=palItems.map((it,i)=>{ const head=it.g!==g?`<div class="g">${(g=it.g)}</div>`:''; return head+`<div class="o ${i===palSel?'sel':''}" data-i="${i}">${it.h}<span class="r">${it.r}</span></div>`; }).join('')||'<div class="empty">Nothing matches</div>';
  $$('#palRes .o').forEach(o=>o.onclick=()=>{ closePal(); palItems[+o.dataset.i].run(); });
}
$('#palIn').oninput=()=>{ palSel=0; palRender(); };
$('#palIn').onkeydown=e=>{ if(e.key==='ArrowDown'){ palSel=Math.min(palItems.length-1,palSel+1); palRender(); e.preventDefault(); } else if(e.key==='ArrowUp'){ palSel=Math.max(0,palSel-1); palRender(); e.preventDefault(); } else if(e.key==='Enter'&&palItems[palSel]){ closePal(); palItems[palSel].run(); } };
$('#pal').onclick=e=>{ if(e.target.id==='pal') closePal(); };
$('#searchBtn').onclick=openPal;
document.addEventListener('keydown',e=>{
  const typing=/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); openPal(); return; }
  if(e.key==='Escape'){ if($('#pal').classList.contains('open')) closePal(); else closeDrawer(); return; }
  if(typing) return;
  if(e.key==='/'){ e.preventDefault(); openPal(); }
  else if(/^[1-8]$/.test(e.key)&&D.meta){ go(PAGES[+e.key-1][0]); }
});

/* ======================================================================
   Install as an app (PWA)
   ====================================================================== */
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredPrompt=e; $('#installBtn').classList.remove('hide'); });
$('#installBtn').onclick=async()=>{ if(!deferredPrompt) return; deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; $('#installBtn').classList.add('hide'); };
if('serviceWorker' in navigator && location.protocol.startsWith('http') && !window.EMBED) navigator.serviceWorker.register('sw.js').catch(()=>{});

boot();
</script>
