name: Daily update

# NEPSE closes at 3:00 PM Nepal time (09:15 UTC). Run at 3:50 PM NPT, Sunday–Thursday.
on:
  schedule:
    - cron: "5 10 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screener-data
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Update prices, fundamentals (weekly), analysis, backtests, tracker, dashboard
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          PORTFOLIO_CSV: ${{ secrets.PORTFOLIO_CSV }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
        run: python run.py daily
      - name: Save data & dashboard
        run: |
          git config user.name "nepse-screener-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs/data
          git diff --cached --quiet || git commit -m "Daily update $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash || true
          git push
