# =====================================================================
#  NEPSE Screener — main settings
#  Edit these values directly on GitHub (pencil icon) — the next
#  scheduled run will pick them up automatically.
# =====================================================================

data:
  history_start: "2019-01-01"        # backfill start date (YYYY-MM-DD)
  # Order in which price-history sources are tried during backfill.
  #   merolagani  -> bonus/right ADJUSTED history (preferred for indicators)
  #   nepse_api   -> official nepalstock.com data (unadjusted; auto-adjusted here)
  history_sources: [merolagani, nepse_api]
  # Order in which sources are tried for the daily end-of-day update.
  daily_sources: [nepse_api, merolagani_latest, merolagani]
  # Order for fundamentals (EPS, P/E, Book value, dividend...).
  fundamental_sources: [merolagani, sharesansar]
  request_delay_sec: 0.7             # politeness delay between web requests
  request_timeout_sec: 25
  # Sectors that are NOT ordinary equity and are excluded from the screener
  exclude_sectors:
    - Mutual Fund
    - Corporate Debenture
    - Corporate Debentures
    - Government Bonds
    - Promoter Share
    - Preference Share
  exclude_symbol_patterns: ["^.*PO$", "^.*D\\d{2,4}$", "^.*PR$"]   # promoter / debenture style tickers
  min_history_days: 60               # stocks with less history are listed but not scored
  # a one-day drop beyond the daily price limit => treated as a bonus/right adjustment
  # (the limit was 10% until 2026-04-19 and 15% from 2026-04-20)
  corporate_action_threshold: -0.11

market:
  face_value: 100                    # NPR face value used for dividend-yield maths
  circuit_limit: 0.15                # NEPSE daily price band per stock (±15% since 20 Apr 2026)
  circuit_limit_history:             # [from date, limit]; used for backtests and corporate-action detection
    - ["2000-01-01", 0.10]
    - ["2026-04-20", 0.15]
  settlement_days: 2                 # T+2
  min_lot: 10                        # minimum regular-market order (kitta)
  trading_days_per_year: 230         # NEPSE trades Mon–Fri (Sun–Thu until 2025), minus holidays

liquidity:
  min_avg_turnover: 2000000          # NPR 20-day average turnover to be "liquid"
  max_pct_of_volume: 0.10            # backtest: max share of a day's volume we can trade

# ---------------------------------------------------------------------
#  Trading costs & tax (verify with your broker; SEBON revises these)
#  Commission tiers: [upper_limit_npr, rate]; null = no upper limit
# ---------------------------------------------------------------------
costs:
  broker_commission_tiers:
    - [50000, 0.0036]
    - [500000, 0.0033]
    - [2000000, 0.0031]
    - [10000000, 0.0027]
    - [null, 0.0024]
  min_commission: 10
  sebon_fee: 0.00015                 # 0.015% on buy and sell
  dp_charge: 25                      # per scrip, per sell day
  # Capital gains tax for resident individuals, listed shares
  # (gazetted 22 Sept 2026: 3.75% if held > 365 days, 5% otherwise)
  cgt_long_term: 0.0375
  cgt_short_term: 0.05
  long_term_days: 365

regime:
  # Market regime: Bull (1), Recovery (0.5), Neutral (0), Bear (-1)
  index_symbol: NEPSE
  fast_ma: 50
  slow_ma: 200
  breadth_bull: 0.55                 # share of stocks above their 50-DMA
  breadth_bear: 0.35
  # Recovery = early bottom: index back above a rising 50-EMA plus a breadth
  # thrust (stocks above their 50-DMA jump from < low to > high within N
  # sessions) or more new 52-week highs than lows.
  recovery_enabled: true
  thrust_low: 0.25
  thrust_high: 0.50
  thrust_window: 15                  # sessions for the jump
  thrust_memory: 60                  # sessions a thrust keeps "recovery" alive

# ---------------------------------------------------------------------
#  Composite score (0–100) = weighted blend of factor scores.
#  Missing factors (e.g. no fundamentals yet) are re-weighted away.
# ---------------------------------------------------------------------
scoring:
  # Weights from factor studies on 2020-2026 data (rank IC of each factor score
  # vs forward excess return over NEPSE). The decisive test used point-in-time
  # fundamentals from NEPSE filings, 2023-01 to 2026-11: value IC(60d) 0.149,
  # quality 0.071, trend 0.019, momentum ~0, liquidity -0.089 (high turnover
  # lags). Composite score IC(60d): old weights 0.058, previous set 0.078,
  # these 0.114 (set chosen before the clean test was run).
  # History: until 19 Nov 2026 trend .22 momentum .18 volume .08 timing .05
  # sector .10 value .17 quality .15 liquidity .05; then briefly trend .25
  # momentum .08 volume .08 timing .07 sector .10 value .20 quality .17.
  weights:
    trend: 0.15
    momentum: 0.05
    volume: 0.05
    timing: 0.05
    sector: 0.05
    value: 0.38
    quality: 0.27
    liquidity: 0.0
  stance_thresholds:
    strong_buy: 75
    buy: 62
    reduce: 40
    exit: 28
  overbought_rsi: 80
  overextended_pct_above_ema50: 0.25

  # -------------------------------------------------------------------
  #  How the market regime affects BUY calls
  #    hard     : no buys in a bear market (original rule)
  #    soft     : buys allowed, but score is reduced and thresholds raised
  #    leaders  : in a bear market only sector-leading RS leaders can be buys
  #    sizing   : buys allowed; suggested position size and stop shrink instead
  #    combined : soft + leaders + sector regime + recovery + sizing + accumulate
  # -------------------------------------------------------------------
  regime_policy:
    mode: combined
    # rule 1 — score adjustment and thresholds by regime
    score_adjust:     {bull: 0,  recovery: -2, neutral: -3, bear: -8}
    buy_threshold:    {bull: 62, recovery: 64, neutral: 65, bear: 70}
    strong_threshold: {bull: 75, recovery: 77, neutral: 78, bear: 83}
    # rule 2 — who counts as a leader in a bear market
    leader_rs_min: 85
    leader_sector_rs_min: 70
    # rule 4 — judge each stock by its own sector's trend first
    use_sector_regime: true
    # rule 5 — suggested position size (fraction of normal) and ATR stop multiple
    position_size: {bull: 1.0, recovery: 0.5, neutral: 0.5, bear: 0.25}
    stop_atr:      {bull: 3.0, recovery: 2.5, neutral: 2.5, bear: 2.0}
    # rule 6 — ACCUMULATE: long-term value buying in bear / recovery markets
    accumulate_enabled: true
    accumulate_value_min: 75          # value score (sector-relative) at least this
    accumulate_quality_pct_min: 0.5   # ROE at least sector median
    accumulate_max_npl: 0.05          # banks/FIs: skip if NPL above this (when known)
    accumulate_size: 0.25

portfolio:
  atr_stop_multiple: 3.0             # used when regime_policy sizing is off; otherwise stop_atr by regime
  hard_stop_pct: 0.15                # max loss from WACC before forced EXIT review
  max_position_weight: 0.20
  max_sector_weight: 0.40
  reduce_fraction: 0.5               # how much to sell on a REDUCE call
  tax_wait_window_days: 30           # suggest waiting if long-term CGT is this close
  bear_market_cash_target: 0.40

backtest:
  initial_capital: 1000000
  execution: next_open               # next_open | next_close
  # fundamentals_mode:
  #   reports         -> EPS / net worth from NEPSE filings, each used only from the
  #                      day after it was filed; other fields from weekly snapshots (honest)
  #   point_in_time   -> only the screener's own weekly snapshots (needs a year of history)
  #   current_backfill-> apply today's EPS/BVPS to the past (optimistic, flagged)
  #   auto            -> reports when data/fundamentals/reports.csv exists, else as before
  fundamentals_mode: auto
  risk_free_rate: 0.05
  start: "2020-01-01"
  end: null

optimize:
  train_fraction: 0.7
  objective: calmar                  # calmar | sharpe | cagr
  max_combinations: 60

tracking:
  horizons: [5, 20, 60]              # trading days after a call to evaluate it
  simulated_history_days: 750        # build a simulated track record over this window
  model_version: "1.0"
  # Your portfolio's own action log reveals what you hold. Keep this false
  # unless the GitHub repository is PRIVATE. (Model calls for every stock —
  # including the ones you hold — are always tracked.)
  log_portfolio_actions: false

export:
  history_bars: 500                  # bars per stock written for dashboard charts
  equity_curve_points: 400

alerts:
  enabled: true                      # needs GMAIL_USER / GMAIL_APP_PASSWORD / ALERT_TO secrets
  subject_prefix: "[NEPSE Screener]"
